<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>WireNest 3D</title>
<style>
  html,body{margin:0;padding:0}
  :root{
    --bg:#f0f1f2; --panel:#ffffff; --panel2:#f5f5f5; --panel3:#ececec;
    --border:#e6e6e6; --border2:#d9d9d9;
    --txt:#1e1e1e; --muted:#7d7d7d; --faint:#b3b3b3;
    --accent:#0d99ff; --accent-d:#0b87e0; --cyan:#00a2c2;
    --good:#14ae5c; --warn:#f2994a; --bad:#f24822;
    --shadow:0 6px 20px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.03);
    --mono:"Pretendard Variable",Pretendard,ui-monospace,Consolas,monospace;
    --sans:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#1e1e1e; --panel:#2c2c2c; --panel2:#383838; --panel3:#454545;
    --border:#3a3a3a; --border2:#4d4d4d;
    --txt:#ffffff; --muted:#a5a5a5; --faint:#6b6b6b;
    --shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  #app{height:100vh;width:100%;display:grid;grid-template-columns:48px 1fr 264px;grid-template-rows:48px 1fr 26px;
    grid-template-areas:"top top top" "tools canvas insp" "tools status status";
    background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:12.5px;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  #top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);overflow:hidden}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:-.2px;white-space:nowrap}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
  .brand small{color:var(--accent);font-weight:700;font-size:11px}
  .seg{display:flex;background:var(--panel2);border-radius:8px;padding:2px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;border-radius:6px}
  .seg button:hover{color:var(--txt)}
  .seg button.on{background:var(--panel);color:var(--txt);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  :root[data-theme="dark"] .seg button.on{background:#4d4d4d}
  .spacer{flex:1}
  .tbtn{border:0;background:transparent;color:var(--txt);padding:6px 11px;border-radius:7px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .tbtn:hover{background:var(--panel2)}
  .tbtn.warn{color:var(--bad)}
  .tbtn.warn:hover{background:rgba(242,72,34,.08)}
  .field{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11.5px;white-space:nowrap}
  input,select{background:var(--panel2);border:1px solid transparent;color:var(--txt);border-radius:7px;padding:5px 8px;font:inherit;font-size:12px;font-variant-numeric:tabular-nums}
  input:hover,select:hover{border-color:var(--border2)}
  input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--panel)}
  input[type=checkbox]{accent-color:var(--accent);width:auto}
  input[type=color]{padding:2px;width:30px;height:26px;cursor:pointer;background:var(--panel2)}
  input[type=range]{accent-color:var(--accent)}
  #tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0}
  .tool{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
  .tool svg{width:18px;height:18px}
  .tool:hover{background:var(--panel2);color:var(--txt)}
  .tool.on{background:var(--accent);color:#fff}
  .tool .kbd{position:absolute;bottom:1px;right:3px;font-size:8px;opacity:.55;font-weight:600}
  .toolsep{width:22px;height:1px;background:var(--border);margin:4px 0}
  #canvas-wrap{grid-area:canvas;position:relative;overflow:hidden;background:var(--bg)}
  #cv{position:absolute;inset:0;display:block;touch-action:none}
  #tip{position:absolute;left:12px;bottom:12px;background:var(--panel);border-radius:10px;padding:8px 12px;color:var(--muted);font-size:11.5px;pointer-events:none;box-shadow:var(--shadow);max-width:460px;line-height:1.55}
  #tip b{color:var(--txt);font-weight:600}
  #tip kbd{font-family:var(--sans);background:var(--panel2);border:1px solid var(--border2);border-radius:4px;padding:0 5px;font-size:10.5px;color:var(--txt);font-weight:600}
  #insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;overflow-x:hidden}
  .sec{border-bottom:1px solid var(--border);padding:12px 14px}
  .sec h3{margin:0 0 10px;font-size:11px;letter-spacing:.2px;color:var(--txt);font-weight:700;display:flex;align-items:center;justify-content:space-between}
  .sec h3 .badge{background:var(--panel2);color:var(--muted);border-radius:20px;padding:2px 9px;font-size:10.5px;font-weight:500}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .row label{width:58px;color:var(--muted);font-size:11.5px;flex-shrink:0}
  .row .grow{flex:1;min-width:0}
  .row input[type=text],.row select,.row input.mm{width:100%}
  .duo{display:flex;gap:6px}.duo input{width:100%}.trio{display:flex;gap:5px}.trio input{width:100%}
  .empty{color:var(--faint);font-size:12px;text-align:center;padding:26px 10px;line-height:1.7}
  .btn-full{width:100%;justify-content:center;margin-top:4px;background:var(--panel2)}
  .btn-full:hover{background:var(--panel3)}
  .chiplist{display:flex;flex-direction:column;gap:4px}
  .chip{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;background:transparent;border:1px solid transparent;cursor:pointer;font-size:12px}
  .chip:hover{background:var(--panel2)}
  .chip.on{background:rgba(13,153,255,.10);border-color:rgba(13,153,255,.35)}
  .chip .sw{width:13px;height:13px;border-radius:4px;flex-shrink:0}
  .chip .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .chip .ct{color:var(--faint);font-size:10.5px;font-variant-numeric:tabular-nums}
  .chip .x{color:var(--faint);padding:0 3px;border-radius:4px}.chip .x:hover{color:var(--bad)}
  .miniadd{display:flex;gap:6px;margin-top:8px}.miniadd input{flex:1;width:auto}
  .miniadd .tbtn{background:var(--panel2)}
  .facegrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .facegrid button,.kindgrid button{border:1px solid var(--border);background:var(--panel);color:var(--txt);border-radius:7px;padding:6px 4px;cursor:pointer;font:inherit;font-size:11.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:5px}
  .facegrid button:hover,.kindgrid button:hover{border-color:var(--border2);background:var(--panel2)}
  .facegrid button.on,.kindgrid button.on{border-color:var(--accent);background:rgba(13,153,255,.08);color:var(--txt)}
  .kindgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .kindgrid button .d{width:9px;height:9px;border-radius:50%}
  .hint{color:var(--faint);font-size:11px;line-height:1.55;margin-top:6px}
  #status{grid-area:status;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 12px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;overflow:hidden}
  #status .k{color:var(--faint)} #status .val{color:var(--txt);font-weight:500} #status .simon{color:var(--good);font-weight:600}
  .divv{width:1px;height:14px;background:var(--border)}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}::-webkit-scrollbar-thumb:hover{background:var(--faint)}::-webkit-scrollbar-track{background:transparent}
  .menuwrap{position:relative}
  .dropdown{position:fixed;min-width:200px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:55}
  .dropdown button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:transparent;border:0;color:var(--txt);font:inherit;font-size:12.5px;font-weight:500;padding:8px 11px;border-radius:8px;cursor:pointer;text-align:left}
  .dropdown button:hover{background:var(--accent);color:#fff}
  .dropdown button:hover .sc{color:rgba(255,255,255,.75)}
  .dropdown button .sc{color:var(--faint);font-size:11px}
  .dd-sep{height:1px;background:var(--border);margin:5px 8px}
  #projname{font-weight:600;color:var(--txt);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  #projname .dirty{color:var(--accent)}
  .overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(20,22,26,.45);backdrop-filter:blur(4px)}
  .overlay[hidden]{display:none}
  :root[data-theme="dark"] .overlay{background:rgba(0,0,0,.55)}
  .home-card,.modal-card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:34px 36px;width:min(460px,92vw);position:relative}
  .home-brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:-.4px}
  .home-brand .dot{width:13px;height:13px;border-radius:4px;background:var(--accent)}
  .home-brand small{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
  .home-sub{color:var(--muted);font-size:13px;margin:10px 0 24px;line-height:1.6}
  .home-actions,.modal-actions{display:flex;gap:10px}
  .home-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--txt);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
  .home-btn small{font-weight:400;font-size:11px;color:var(--muted)}
  .home-btn:hover{border-color:var(--accent);background:rgba(13,153,255,.05)}
  .home-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .home-btn.primary small{color:rgba(255,255,255,.8)}
  .home-btn.primary:hover{background:var(--accent-d)}
  .home-btn.ghost{flex:0 0 auto;background:transparent;border-color:var(--border);font-weight:500}
  .home-newform{display:flex;gap:8px;margin-top:14px}
  .home-newform input{flex:1;font-size:14px;padding:11px 13px;border:1px solid var(--border2);background:var(--panel)}
  .home-newform .home-btn{flex:0 0 auto;flex-direction:row;padding:0 18px}
  .home-foot{margin-top:24px;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .home-foot a{color:var(--accent);cursor:pointer;font-weight:500}.home-foot a:hover{text-decoration:underline}
  .modal-card h3{margin:0 0 6px;font-size:17px;font-weight:700;letter-spacing:-.2px}.modal-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .modal-x{position:absolute;top:14px;right:16px;background:transparent;border:0;color:var(--muted);font-size:15px;cursor:pointer;border-radius:6px;padding:3px 6px}
  .modal-x:hover{background:var(--panel2);color:var(--txt)}
  #outliner{position:absolute;top:12px;left:12px;width:200px;max-height:calc(100% - 24px);background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none;flex-direction:column;z-index:4}
  #outliner .oh{padding:10px 13px 8px;font-size:11px;color:var(--txt);font-weight:700;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
  #outliner .oh span:last-child{color:var(--faint);font-weight:500}
  #outliner .olist{overflow-y:auto;padding:5px}
  .orow{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;cursor:pointer;color:var(--txt);font-size:12px}
  .orow:hover{background:var(--panel2)}
  .orow.on{background:rgba(13,153,255,.10);outline:1px solid rgba(13,153,255,.4)}
  .orow .eye{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--faint);flex-shrink:0;border-radius:5px}
  .orow .eye:hover{background:var(--panel3);color:var(--txt)} .orow .eye svg{width:14px;height:14px}
  .orow.hid{opacity:.5} .orow.hid .onm{text-decoration:line-through}
  .orow .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .orow .onm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  @media (max-width:900px){#app{grid-template-columns:44px 1fr;grid-template-areas:"top top" "tools canvas" "status status"}#insp{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand"><span class="dot"></span>WireNest <small style="color:var(--cyan);font-weight:600">3D</small></div>
    <div class="menuwrap"><button class="tbtn" id="filemenu">파일 ▾</button>
      <div class="dropdown" id="filedd" hidden>
        <button data-a="new">새 프로젝트</button><button data-a="open">열기…</button>
        <button data-a="save">저장<span class="sc">Ctrl+S</span></button>
        <div class="dd-sep"></div><button data-a="export">내보내기…</button>
        <div class="dd-sep"></div><button data-a="home">홈 화면</button>
      </div></div>
    <span id="projname"></span>
    <div class="seg" id="viewseg"></div>
    <div class="field">배선 <select id="wirestyle"><option value="curve">곡선</option><option value="straight">직선</option><option value="none">숨김</option></select></div>
    <div class="field">스냅 <input id="snapmm" type="number" min="0" step="0.5" value="1" style="width:50px"> mm</div>
    <div class="spacer"></div>
    <button class="tbtn" id="simbtn">▶ 시뮬</button>
    <button class="tbtn" id="schbtn">회로도</button>
    <div class="divv"></div>
    <button class="tbtn" id="themebtn" title="테마">◐</button>
    <input type="file" id="loadfile" accept="application/json,.wnest" hidden>
    <input type="file" id="imgfile" accept="image/*" hidden>
  </div>
  <div id="tools"></div>
  <div id="canvas-wrap"><canvas id="cv"></canvas><div id="outliner"></div><div id="tip"></div></div>
  <div id="insp"></div>
  <div id="status">
    <span><span class="k">뷰</span> <span class="val" id="st-view">3D</span></span>
    <span><span class="k">보드</span> <span class="val" id="st-boards">0</span></span>
    <span><span class="k">패드</span> <span class="val" id="st-nodes">0</span></span>
    <span><span class="k">배선</span> <span class="val" id="st-wires">0</span></span>
    <span class="divv"></span><span id="st-sel" class="val">선택 없음</span>
    <span class="spacer" style="flex:1"></span><span id="st-mode"></span>
  </div>
  <div id="home" class="overlay">
    <div class="home-card">
      <div class="home-brand"><span class="dot"></span>WireNest <small>3D 하네스 에디터</small></div>
      <p class="home-sub">PCB 배치·배선을 <b>실제 3D</b>로 계획하고, <b>.wnest</b> 프로젝트 파일로 저장하세요. (index.html과 데이터 호환)</p>
      <div class="home-actions">
        <button id="home-new" class="home-btn primary">＋ 새 프로젝트<small>이름을 정해 시작</small></button>
        <button id="home-open" class="home-btn">📂 열기<small>.wnest 파일 불러오기</small></button>
      </div>
      <div id="home-newform" class="home-newform" hidden>
        <input id="home-name" type="text" placeholder="프로젝트 이름" maxlength="60">
        <button id="home-create" class="home-btn primary">만들기</button>
        <button id="home-cancel" class="home-btn ghost">취소</button>
      </div>
      <div class="home-foot"><a id="home-sample">예제로 시작 →</a><span id="home-fsnote"></span></div>
    </div>
  </div>
  <div id="expdlg" class="overlay" hidden>
    <div class="modal-card"><button id="exp-close" class="modal-x">✕</button>
      <h3>내보내기</h3><p>무엇으로 내보낼까요?</p>
      <div class="modal-actions">
        <button id="exp-file" class="home-btn primary">프로젝트 파일<small>.wnest · 다시 편집 가능</small></button>
        <button id="exp-img" class="home-btn">PNG 이미지<small>보기·공유용</small></button>
        <button id="exp-txt" class="home-btn">텍스트 배선표<small>AI 확인·검토용</small></button>
        <button id="exp-sch" class="home-btn">회로도 PNG<small>2D 다이어그램</small></button>
      </div>
    </div>
  </div>
  <div id="schdlg" class="overlay" hidden>
    <div style="background:var(--panel);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);padding:14px;max-width:94vw;max-height:92vh;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;gap:10px">
        <b style="font-size:14px">회로도</b><span style="color:var(--muted);font-size:11.5px">보드·패드·네트 연결 다이어그램</span>
        <span style="flex:1"></span>
        <button class="tbtn" id="sch-export">PNG 내보내기</button>
        <button class="tbtn" id="sch-close">닫기</button>
      </div>
      <div style="overflow:auto;border:1px solid var(--border);border-radius:8px;background:#fdfdf8"><canvas id="schcv"></canvas></div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';

// ===== constants =====
const AWG={30:0.255,28:0.321,26:0.405,24:0.511,22:0.644,20:0.812,18:1.024,16:1.291,14:1.628,12:2.053};
const KINDS={gnd:{label:"GND",color:"#78909c"},power:{label:"전원",color:"#ef5350"},signal:{label:"신호",color:"#ab47bc"}};
const NETCOLORS=["#ef5350","#ffa726","#ffee58","#66bb6a","#26c6da","#42a5f5","#7e57c2","#ec407a","#8d6e63","#bdbdbd"];
const FACES=[["top","앞면"],["bottom","뒷면"]];
const VIEWS=[["iso","3D"],["top","Top"],["front","Front"],["bottom","Bottom"]];
const VIEWDIR={iso:[1,0.9,1],top:[0,1,0.0001],bottom:[0,-1,0.0001],front:[0,0,1],back:[0,0,-1],left:[-1,0,0],right:[1,0,0]};
let uid=1; const nid=()=>"i"+(uid++);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const r2=n=>Math.round(n*10)/10;

const S={boards:{},nodes:{},wires:{},nets:{},texts:{},groups:{},view:"iso",tool:"select",wireStyle:"curve",
  sel:null,selList:[],wireStart:null,simulate:false,activeNet:null,defaultAwg:22,defaultNet:null,project:null};
const selHas=(t,id)=>S.selList.some(s=>s.t===t&&s.id===id);
const DEF_PAD=3.0; // 패드 기본 지름 mm (기존 4.2에서 -30%)
const padR=n=>(n.size!=null?n.size:DEF_PAD)/2; // 반지름
let LIT={n:new Set(),w:new Set()};
let snapMM=1; const snapv=v=>snapMM>0?Math.round(v/snapMM)*snapMM:v;
const texCache={}; let pendingImgBoard=null,pendingImgFace="top";
const blist=()=>Object.values(S.boards),nlist=()=>Object.values(S.nodes),wlist=()=>Object.values(S.wires),tlist=()=>Object.values(S.texts||{});

// ===== three setup =====
const cv=document.getElementById("cv"),wrap=document.getElementById("canvas-wrap");
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
let W=1,H=1,frust=140;
const camera=new THREE.OrthographicCamera(-1,1,1,-1,-5000,5000);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.12;controls.screenSpacePanning=true;
controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.PAN,RIGHT:null}; // 우버튼=마퀴 선택

      if(tx.board){const d=padData(tx),v=toThree(d[0],d[1],d[2]);px+=v.x;py+=v.y;pz+=v.z;}else{px+=tx.x;py+=tx.y;pz+=tx.z;}cnt++;}}
  if(!cnt){tc.detach();return;}

function applyDelta(dx,dy,dz){for(const s of S.selList){

    wpsOf(w).forEach(p=>{p.x+=dx;p.y+=dy;p.z+=dz;});}
  else if(s.t==="text"){const tx=S.texts[s.id];if(!tx)continue;
    if(tx.board){const bb=bBox(S.boards[tx.board]);let ldx=dx,ldy=dz;
      if(bb.rot){const a=-bb.rot*Math.PI/180,c=Math.cos(a),si=Math.sin(a);const nx=ldx*c-ldy*si,ny=ldx*si+ldy*c;ldx=nx;ldy=ny;}
      tx.u=r2(Math.max(0,Math.min(bb.w,tx.u+ldx)));tx.v=r2(Math.max(0,Math.min(bb.d,tx.v+ldy)));}
    else{tx.x+=dx;tx.y+=dy;tx.z+=dz;}}
  else if(s.t==="board"){const b=S.boards[s.id];if(!b)continue;b.x=r2(b.x+dx);b.z=r2((b.z||0)+dy);b.y=r2(b.y+dz);}
  else if(s.t==="node"){const n=S.nodes[s.id];if(!n||!n.board)continue;const bb=bBox(S.boards[n.board]);let ldx=dx,ldy=dz;
    if(bb.rot){const a=-bb.rot*Math.PI/180,c=Math.cos(a),si=Math.sin(a);const nx=ldx*c-ldy*si,ny=ldx*si+ldy*c;ldx=nx;ldy=ny;}
    n.u=r2(Math.max(0,Math.min(bb.w,n.u+ldx)));n.v=r2(Math.max(0,Math.min(bb.d,n.v+ldy)));}}}

// ===== coord mapping: data(x,y,z; z up) -> three(x, z, y) [three Y = up = data z] =====
function bBox(b){return {x:b.x,y:b.y,z:b.z||0,w:b.w,d:b.d!=null?b.d:(b.h||30),t:b.thick||1.6,rot:b.rot||0};}
function rotZ(x,y,cx,cy,deg){const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a),dx=x-cx,dy=y-cy;return [cx+dx*c-dy*s,cy+dx*s+dy*c];}
function padData(p){ // returns data-space world [x,y,z]
  const b=S.boards[p.board]; if(!b)return[p.wx||0,p.wy||0,p.wz||0];
  const {x,y,z,w,d,t,rot}=bBox(b);
  let wx=x+p.u,wy=y+p.v,wz=(p.face==="bottom")?z:z+t;
  if(rot){const cx=x+w/2,cy=y+d/2;[wx,wy]=rotZ(wx,wy,cx,cy,rot);}
  return [wx,wy,wz];
}
function padDataOff(p,du,dv){const b=S.boards[p.board];if(!b)return padData(p);const {x,y,z,w,d,t,rot}=bBox(b);let wx=x+p.u+du,wy=y+p.v+dv,wz=(p.face==="bottom")?z:z+t;if(rot){const cx=x+w/2,cy=y+d/2;[wx,wy]=rotZ(wx,wy,cx,cy,rot);}return [wx,wy,wz];}
const toThree=(x,y,z)=>new THREE.Vector3(x,z,y);        // data->three
const padVec=p=>{const d=padData(p);return toThree(d[0],d[1],d[2]);};

function makeLabel(text,worldScale,col){const c=document.createElement("canvas"),x=c.getContext("2d");x.font="bold 40px sans-serif";const tw=x.measureText(text).width;c.width=Math.ceil(tw)+18;c.height=52;
  x.font="bold 40px sans-serif";x.fillStyle="rgba(0,0,0,0.5)";x.fillRect(0,0,c.width,c.height);x.fillStyle=col||"#fff";x.textBaseline="middle";x.fillText(text,9,c.height/2+1);
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));
  sp.scale.set(worldScale*c.width/c.height,worldScale,1);sp.renderOrder=10;return sp;}
function makeSilk(text){const c=document.createElement("canvas"),x=c.getContext("2d");x.font="bold 40px sans-serif";const tw=Math.max(24,x.measureText(text).width);c.width=Math.ceil(tw)+10;c.height=46;
  x.font="bold 40px sans-serif";x.fillStyle="rgba(233,239,245,0.95)";x.textBaseline="middle";x.textAlign="center";x.fillText(text,c.width/2,c.height/2+1);
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;tex.colorSpace=THREE.SRGBColorSpace;
  const wmm=1.8,geo=new THREE.PlaneGeometry(wmm*c.width/c.height,wmm);

function makeTextPlane(txt,sizeMm,sel){const lines=String(txt||" ").split("\n");
  const c=document.createElement("canvas"),x=c.getContext("2d");const F='bold 48px "Pretendard Variable",Pretendard,sans-serif';
  x.font=F;const wpx=Math.max(30,...lines.map(l=>x.measureText(l).width))+14;
  c.width=Math.ceil(wpx);c.height=lines.length*56+6;
  x.font=F;x.fillStyle=sel?"#5ab6ff":"rgba(235,240,246,.96)";x.textBaseline="middle";x.textAlign="center";
  lines.forEach((l,i)=>x.fillText(l,c.width/2,31+i*56));
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;tex.colorSpace=THREE.SRGBColorSpace;
  const s=sizeMm/56;return new THREE.Mesh(new THREE.PlaneGeometry(c.width*s,c.height*s),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));}
function makeMemoSprite(txt,sizeMm,sel){const lines=String(txt||" ").split("\n");

function rebuild(){
  disposeGroup(boardG);disposeGroup(padG);disposeGroup(wireG);disposeGroup(labelG);disposeGroup(textG);
  const selId=S.sel?S.sel.id:null;
  for(const b of blist()){if(b.hidden)continue;const {x,y,z,w,d,t,rot}=bBox(b);
    const geo=new THREE.BoxGeometry(w,t,d);
    const side=new THREE.MeshLambertMaterial({color:new THREE.Color(b.color||"#1c5e38")});
    const faceMat=(url,key)=>{if(!url)return side;let tex=texCache[key];if(!tex||tex.__url!==url){if(tex)tex.dispose();tex=new THREE.TextureLoader().load(url,()=>{needRender=true;});tex.colorSpace=THREE.SRGBColorSpace;tex.__url=url;tex.__cached=true;texCache[key]=tex;}return new THREE.MeshLambertMaterial({map:tex});};
    const mats=[side,side,faceMat(b.img,b.id+":top"),faceMat(b.imgBottom,b.id+":bot"),side,side]; // +X,-X,+Y(앞면),-Y(뒷면),+Z,-Z
    const m=new THREE.Mesh(geo,mats);
    m.position.set(x+w/2,z+t/2,y+d/2);m.rotation.y=-(rot||0)*Math.PI/180;

  }
  for(const n of nlist()){if(n.board&&S.boards[n.board]&&S.boards[n.board].hidden)continue;const v=padVec(n),col=(KINDS[n.kind]||KINDS.signal).color;
    const lit=LIT.n.has(n.id);
    const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(lit?"#fff2c4":col),emissive:new THREE.Color(lit?col:"#000"),emissiveIntensity:lit?0.7:0,metalness:0.1,roughness:0.5});
    const rr=padR(n),hh=Math.max(0.6,rr*0.9);
    const m=new THREE.Mesh(new THREE.CylinderGeometry(rr,rr,hh,18),mat);

    if(n.board){ // 실크스크린: 패드 아래에 보드 면에 새겨진 라벨
      const ld=padDataOff(n,0,rr+1.7),lv=toThree(ld[0],ld[1],ld[2]),silk=makeSilk(n.name);
      silk.position.copy(lv);silk.position.y+=(n.face==="bottom"?-0.06:0.06);
      silk.rotation.order="YXZ";silk.rotation.y=-((S.boards[n.board]&&S.boards[n.board].rot)||0)*Math.PI/180;silk.rotation.x=(n.face==="bottom"?Math.PI/2:-Math.PI/2);
      labelG.add(silk);
    }
  }
  for(const w of wlist()){if(S.wireStyle==="none")break;const a=S.nodes[w.a],b=S.nodes[w.b];if(!a||!b)continue;
    if(S.activeNet&&w.netId!==S.activeNet)continue; // 네트 격리: 선택 네트만 표시
    if((a.board&&S.boards[a.board]&&S.boards[a.board].hidden)||(b.board&&S.boards[b.board]&&S.boards[b.board].hidden))continue;
    const pa=padVec(a),pb=padVec(b);const net=S.nets[w.netId];

}

const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();
function setNDC(e){const r=cv.getBoundingClientRect();ndc.x=((e.clientX-r.left)/r.width)*2-1;ndc.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(ndc,camera);}
function pick(prefer){ // prefer 'pad'|'board'|null
  const groups=prefer==="pad"?[padG]:prefer==="board"?[boardG]:[padG,textG,wireG,boardG];
  for(const g of groups){const hit=ray.intersectObjects(g.children.filter(o=>o.userData&&o.userData.kind),false);
    if(hit.length)return {ud:hit[0].object.userData,point:hit[0].point};}
  return null;
}
function groundPoint(){const pl=new THREE.Plane(new THREE.Vector3(0,1,0),0);const pt=new THREE.Vector3();return ray.ray.intersectPlane(pl,pt)?pt:null;}
function pickWireAt(){const hit=ray.intersectObjects(wireG.children.filter(o=>o.userData&&o.userData.kind==="wire"),false);return hit.length?hit[0].object.userData.id:null;}
const wpsOf=w=>{if(w&&w.wp&&!w.wps){w.wps=[w.wp];delete w.wp;}return (w&&w.wps)||[];}; // 레거시 wp→wps 이관
function addWp(w){if(!w||wpsOf(w).length)return false;const a=S.nodes[w.a],b=S.nodes[w.b];if(!a||!b)return false;
  const pa=padVec(a),pb=padVec(b),dist=pa.distanceTo(pb);
  const at=t=>{const p=pa.clone().lerp(pb,t);p.y+=10;return{x:p.x,y:p.y,z:p.z};};
  w.wps=dist>90?[at(1/3),at(2/3)]:[at(0.5)]; // 긴 배선(>90mm)은 경유점 2개
  return true;}
function wireMid(w){const a=S.nodes[w.a],b=S.nodes[w.b];if(!a||!b)return null;return padVec(a).lerp(padVec(b),0.5);}
function bundleWires(ws){pushUndo();markDirty();
  const c=new THREE.Vector3();let n=0;ws.forEach(w=>{const m=wireMid(w);if(m){c.add(m);n++;}});if(!n)return;
  c.multiplyScalar(1/n);c.y+=12;
  ws.forEach(w=>{delete w.wp;w.wps=[{x:c.x,y:c.y,z:c.z}];});
  setSel(ws.map(w=>({t:"wire",id:w.id})));rebuild();toast("묶기 포인트 생성 — 기즈모로 함께 이동");}
let ctxEl=null;
function closeCtx(){if(ctxEl){ctxEl.remove();ctxEl=null;}}
document.addEventListener("click",closeCtx);
function rightClickWire(id,cx,cy){const w=S.wires[id];if(!w)return;
  const selW=S.selList.filter(s=>s.t==="wire").map(s=>s.id);
  const ids=(S.selList.length>1&&selW.includes(id))?selW:[id];
  if(ids.length===1)select("wire",id);
  const ws=ids.map(i=>S.wires[i]).filter(Boolean);
  const miss=ws.filter(x=>!wpsOf(x).length).length,have=ws.length-miss;
  closeCtx();ctxEl=h(`<div class="dropdown" style="left:${cx}px;top:${cy}px">
    ${miss?`<button data-a="add">경유점 추가${ws.length>1?` (${miss}개)`:''}</button>`:''}
    ${ws.length>1?`<button data-a="bundle">묶기 포인트<span class="sc">${ws.length}선</span></button>`:''}
    ${have?`<div class="dd-sep"></div><button data-a="rm">경유점 제거${ws.length>1?` (${have}개)`:''}</button>`:''}
  </div>`);
  document.body.appendChild(ctxEl);
  ctxEl.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();const a=b.dataset.a;closeCtx();
    if(a==="add"){pushUndo();markDirty();ws.forEach(addWp);rebuild();toast("경유점 추가 — 기즈모로 이동");}
    else if(a==="bundle")bundleWires(ws);
    else if(a==="rm"){pushUndo();markDirty();ws.forEach(x=>{delete x.wp;delete x.wps;});rebuild();}});}

function drawMarq(x1,y1){const r=cv.getBoundingClientRect();marqDiv.style.left=(Math.min(marq.x0,x1)-r.left)+"px";marqDiv.style.top=(Math.min(marq.y0,y1)-r.top)+"px";marqDiv.style.width=Math.abs(x1-marq.x0)+"px";marqDiv.style.height=Math.abs(y1-marq.y0)+"px";marqDiv.style.display="block";}
function finishMarq(x1,y1){const r=cv.getBoundingClientRect();
  const bx0=Math.min(marq.x0,x1),by0=Math.min(marq.y0,y1),bx1=Math.max(marq.x0,x1),by1=Math.max(marq.y0,y1);
  const scr=v=>{const p=v.clone().project(camera);return[r.left+(p.x*0.5+0.5)*r.width,r.top+(-p.y*0.5+0.5)*r.height];};
  const ptIn=(v,m)=>{const s=scr(v);return s[0]>=bx0-m&&s[0]<=bx1+m&&s[1]>=by0-m&&s[1]<=by1+m;}; // m=여유(px): 걸침 판정
  const boardIn=b=>{const bb=bBox(b),cx=bb.x+bb.w/2,cy=bb.y+bb.d/2;let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
    for(const [px,py] of [[bb.x,bb.y],[bb.x+bb.w,bb.y],[bb.x+bb.w,bb.y+bb.d],[bb.x,bb.y+bb.d]])
      for(const pz of [bb.z,bb.z+bb.t]){let dx=px,dy=py;if(bb.rot)[dx,dy]=rotZ(px,py,cx,cy,bb.rot);
        const s=scr(toThree(dx,dy,pz));mnx=Math.min(mnx,s[0]);mny=Math.min(mny,s[1]);mxx=Math.max(mxx,s[0]);mxy=Math.max(mxy,s[1]);}
    const overlap=!(mxx<bx0||mnx>bx1||mxy<by0||mny>by1);
    const boxInside=bx0>=mnx&&bx1<=mxx&&by0>=mny&&by1<=mxy; // 박스가 보드 안에 완전히 → 보드 말고 내용물 선택
    return overlap&&!boxInside;};
  const list=marq.add?[...S.selList]:[],bset=new Set();
  for(const b of blist()){if(b.hidden)continue;if(boardIn(b)){bset.add(b.id);if(!list.some(s=>s.t==="board"&&s.id===b.id))list.push({t:"board",id:b.id});}}
  for(const n of nlist()){if(n.board&&bset.has(n.board))continue;if(n.board&&S.boards[n.board]&&S.boards[n.board].hidden)continue;if(ptIn(padVec(n),8)&&!list.some(s=>s.t==="node"&&s.id===n.id))list.push({t:"node",id:n.id});}
  for(const w of wlist()){const a=S.nodes[w.a],b=S.nodes[w.b];if(!a||!b)continue;
    if((a.board&&S.boards[a.board]&&S.boards[a.board].hidden)||(b.board&&S.boards[b.board]&&S.boards[b.board].hidden))continue;
    if(list.some(s=>s.t==="wire"&&s.id===w.id))continue;
    const wl=wpsOf(w);
    let hit=wl.some(p=>ptIn(new THREE.Vector3(p.x,p.y,p.z),6));
    if(!hit){const pa=padVec(a),pb=padVec(b); // 경로 샘플링(경유점 없어도 배선 선택)
      for(let i=0;i<=10&&!hit;i++)hit=ptIn(pa.clone().lerp(pb,i/10),5);}
    if(hit)list.push({t:"wire",id:w.id});}
  for(const t of tlist()){if(t.board&&(!S.boards[t.board]||S.boards[t.board].hidden))continue;
    const v=t.board?(()=>{const d=padData(t);return toThree(d[0],d[1],d[2]);})():new THREE.Vector3(t.x,t.y,t.z);
    if(ptIn(v,10)&&!list.some(s=>s.t==="text"&&s.id===t.id))list.push({t:"text",id:t.id});}
  setSel(list);}
cv.addEventListener("pointerdown",e=>{
  if(e.button===2){marq={x0:e.clientX,y0:e.clientY,add:e.shiftKey||e.ctrlKey};cv.setPointerCapture(e.pointerId);drawMarq(e.clientX,e.clientY);e.preventDefault();return;}
  downPos={x:e.clientX,y:e.clientY};});
cv.addEventListener("pointermove",e=>{if(marq)drawMarq(e.clientX,e.clientY);});
cv.addEventListener("pointerup",e=>{
  if(marq){const dm=Math.hypot(e.clientX-marq.x0,e.clientY-marq.y0);
    if(dm>4)finishMarq(e.clientX,e.clientY);
    else{setNDC(e);const wid=pickWireAt();if(wid)rightClickWire(wid,e.clientX,e.clientY);} // 제자리 우클릭이 배선 위면 메뉴
    marqDiv.style.display="none";marq=null;return;}
  if(e.button!==0){downPos=null;return;}
  if(!downPos)return;const moved=Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y);downPos=null;
  if(moved>4)return; // drag = orbit, not click
  setNDC(e);
  if(S.simulate){const h=pick("pad");if(h&&h.ud.kind==="pad"){const n=S.nodes[h.ud.id];if(n){n.state=!n.state;recompute();rebuild();}}return;}
  if(S.tool==="wire"){const h=pick("pad");if(h&&h.ud.kind==="pad"){if(!S.wireStart)S.wireStart=h.ud.id;else if(S.wireStart!==h.ud.id){addWire(S.wireStart,h.ud.id);S.wireStart=e.shiftKey?h.ud.id:null;}}else S.wireStart=null;updateStatus();return;}
  if(S.tool==="pad"){const h=pick("board");if(h&&h.ud.kind==="board"){addPadAt(S.boards[h.ud.id],h.point);}else toast("보드 위를 클릭해 패드를 놓으세요");return;}
  if(S.tool==="board"){const p=groundPoint();if(p)addBoard(p.x,p.z);return;}
  if(S.tool==="text"){const h=pick("board");
    if(h&&h.ud.kind==="board")addBoardText(S.boards[h.ud.id],h.point);
    else{const p=groundPoint();if(p)addMemo(p);}
    return;}
  // select
  const h=pick(null);const add=e.shiftKey||e.ctrlKey||e.metaKey;
  if(h){if(h.ud.kind==="wp"&&!add){select("wire",h.ud.id);S.selWp={id:h.ud.id,idx:h.ud.idx};placeGizmo();return;} // 경유점 개별 선택
    const t=h.ud.kind==="board"?"board":(h.ud.kind==="wire"||h.ud.kind==="wp")?"wire":h.ud.kind==="text"?"text":"node";
    if(add)toggleSel(t,h.ud.id);else select(t,h.ud.id);}
  else if(!add)select(null); // Shift+빈곳 클릭은 선택 유지
});
addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==="s"||e.key==="S")){e.preventDefault();saveProject();return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z")){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==="y"||e.key==="Y")){e.preventDefault();redo();return;}
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA")return;
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==="g"){e.preventDefault();ungroupSel();return;}
  if(e.shiftKey&&!e.ctrlKey&&!e.metaKey&&e.key.toLowerCase()==="g"){e.preventDefault();groupSel();return;}
  if(e.key==="F2"){if(S.sel&&S.sel.t==="board"){const b=S.boards[S.sel.id],row=document.querySelector('#outliner .orow[data-id="'+S.sel.id+'"]');if(b&&row)startEditName(b,row);}return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==="c"||e.key==="C")){copySel();return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==="v"||e.key==="V")){pasteClip();return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==="d"||e.key==="D")){e.preventDefault();copySel();pasteClip();return;}
  const map={v:"select",b:"board",p:"pad",w:"wire",t:"text"};if(!e.ctrlKey&&!e.metaKey&&map[e.key]){S.tool=map[e.key];S.wireStart=null;renderTools();updateStatus();}
  if(e.key==="Delete"||e.key==="Backspace")delSel();
  if(e.key==="Escape"){S.wireStart=null;select(null);}
  if(e.key==="f")fitView();
  const vk={"1":"iso","2":"top","3":"front","4":"bottom"};if(vk[e.key])setView(vk[e.key]);
});

function addBoard(x,z){pushUndo();markDirty();const id=nid();S.boards[id]={id,name:"Board "+(blist().length+1),x:snapv(x-20),y:snapv(z-15),z:0,w:40,d:30,thick:1.6,rot:0,color:"#1c5e38"};

function addPadAt(b,point){pushUndo();markDirty();const id=nid();
  // point is three world on the board mesh; convert to data-local u,v on top face
  const {x,y,z,w,d,t,rot}=bBox(b);let dx=point.x,dy=point.z; // three x/z -> data x/y
  if(rot){const cx=x+w/2,cy=y+d/2;[dx,dy]=rotZ(dx,dy,cx,cy,-rot);}
  let u=Math.max(1,Math.min(w-1,dx-x)),v=Math.max(1,Math.min(d-1,dy-y));
  const face=point.y<z+t/2?"bottom":"top";
  const cnt=nlist().filter(n=>n.board===b.id).length+1;
  S.nodes[id]={id,board:b.id,face,u:snapv(u),v:snapv(v),name:"P"+cnt,kind:"signal",state:false};
  select("node",id);rebuild();
}
function addBoardText(b,point){pushUndo();markDirty();const id=nid();

function addNet(name,color){const id=nid();S.nets[id]={id,name:name||("Net "+(Object.keys(S.nets).length+1)),color:color||NETCOLORS[Object.keys(S.nets).length%NETCOLORS.length]};if(!S.defaultNet)S.defaultNet=id;return id;}
function delSel(){if(!S.selList.length)return;pushUndo();markDirty();
  for(const s of S.selList){
    if(s.t==="board"){const bid=s.id;nlist().forEach(n=>{if(n.board===bid){wlist().forEach(w=>{if(w.a===n.id||w.b===n.id)delete S.wires[w.id];});delete S.nodes[n.id];}});tlist().forEach(t=>{if(t.board===bid)delete S.texts[t.id];});delete S.boards[bid];}
    else if(s.t==="node"){const id=s.id;wlist().forEach(w=>{if(w.a===id||w.b===id)delete S.wires[w.id];});delete S.nodes[id];}

function pasteClip(){if(!clipboard||(!clipboard.boards.length&&!clipboard.pads.length))return;pushUndo();markDirty();

function litSet(){if(!S.simulate)return{n:new Set(),w:new Set()};const adj={};nlist().forEach(n=>adj[n.id]=[]);
  wlist().forEach(w=>{if(adj[w.a]&&adj[w.b]){adj[w.a].push({w:w.id,o:w.b});adj[w.b].push({w:w.id,o:w.a});}});
  const litN=new Set(),litW=new Set(),q=[];nlist().forEach(n=>{if(n.state){litN.add(n.id);q.push(n.id);}});
  while(q.length){const c=q.pop();for(const e of adj[c]){litW.add(e.w);if(!litN.has(e.o)){litN.add(e.o);q.push(e.o);}}}return{n:litN,w:litW};}

function loadSample(){newProject("예제 프로젝트");
  const pos=[[0,0],[62,0],[0,54],[62,54]];const B=[];
  pos.forEach((p,i)=>{const id=nid();S.boards[id]={id,name:"Slot "+(i+1),x:p[0],y:p[1],z:0,w:52,d:46,thick:1.6,rot:0,color:"#1c5e38"};B.push(id);
    const cx=26,cy=23,rad=15;for(let j=0;j<8;j++){const a=(j/8)*Math.PI*2,q=nid();S.nodes[q]={id:q,board:id,face:"top",u:cx+Math.cos(a)*rad,v:cy+Math.sin(a)*rad,name:"D"+(j+1),kind:"signal",state:false};}
    const dq=nid();S.nodes[dq]={id:dq,board:id,face:"top",u:cx-3,v:cy,name:"DQ",kind:"signal",state:false};
    const gn=nid();S.nodes[gn]={id:gn,board:id,face:"bottom",u:cx+3,v:cy,name:"GND",kind:"gnd",state:false};
    const di=nid();S.nodes[di]={id:di,board:id,face:"top",u:4,v:41,name:"DI",kind:"signal",state:false};
    const doo=nid();S.nodes[doo]={id:doo,board:id,face:"top",u:48,v:41,name:"DO",kind:"signal",state:false};
    S.boards[id]._={dq,gn,di,doo};});
  const nets=Object.keys(S.nets);const mkw=(a,b,g,net)=>{const w=nid();S.wires[w]={id:w,a,b,awg:g,netId:net,color:null};};
  const bs=blist();for(let i=0;i<bs.length;i++){const r=bs[i]._;mkw(r.di,r.dq,22,nets[3]);mkw(r.dq,r.doo,22,nets[4]);if(i>0){const pr=bs[i-1]._;mkw(pr.doo,r.di,20,nets[0]);mkw(pr.gn,r.gn,18,nets[1]);}}
  bs.forEach(b=>delete b._);S.sel=null;S.selList=[];recompute();renderInsp();rebuild();requestAnimationFrame(()=>fitView());}
function downloadJSON(data,fn){const blob=new Blob([JSON.stringify(data)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;a.click();}
async function saveProject(){if(!S.project)return;const data=serialize();try{
  if(S.project.fileHandle){const wr=await S.project.fileHandle.createWritable();await wr.write(JSON.stringify(data));await wr.close();S.project.dirty=false;updateProjName();toast("저장됨");return;}await saveProjectAs();}catch(e){if(e.name!=="AbortError")alert("저장 실패: "+e.message);}}
async function saveProjectAs(){if(!S.project)return;const data=serialize();
  if(hasFS){const hd=await showSaveFilePicker({suggestedName:(S.project.name||"harness")+".wnest",types:[{description:"WireNest 프로젝트",accept:{"application/json":[".wnest",".json"]}}]});
    const wr=await hd.createWritable();await wr.write(JSON.stringify(data));await wr.close();S.project.fileHandle=hd;S.project.name=baseName(hd.name);S.project.dirty=false;updateProjName();toast("저장됨");}
  else{downloadJSON(data,(S.project.name||"harness")+".wnest");toast("다운로드됨");}}
async function openProject(){
  if(hasFS){try{const[hd]=await showOpenFilePicker({types:[{description:"WireNest 프로젝트",accept:{"application/json":[".wnest",".json"]}}]});
    const f=await hd.getFile();const d=JSON.parse(await f.text());S.project={name:d.name||baseName(f.name),fileHandle:hd,dirty:false};loadData(d);updateProjName();hideHome();}catch(e){if(e.name!=="AbortError")alert("열기 실패: "+e.message);}}
  else document.getElementById("loadfile").click();}
function exportImage(){needRender=true;renderer.render(scene,camera);const url=renderer.domElement.toDataURL("image/png");const a=document.createElement("a");a.href=url;a.download=((S.project&&S.project.name)||"harness")+".png";a.click();}
function buildText(){const bs=blist(),L=[];
  const nm=id=>{const n=S.nodes[id];if(!n)return"?";const b=S.boards[n.board];return (b?b.name:"?")+"."+n.name;};
  L.push("# WireNest 배선 리포트");
  L.push("프로젝트: "+((S.project&&S.project.name)||"-"));
  L.push(`보드 ${bs.length} · 패드 ${nlist().length} · 배선 ${wlist().length}`);
  L.push("");L.push("## 보드 & 패드");
  bs.forEach(b=>{const bb=bBox(b),pads=nlist().filter(n=>n.board===b.id);
    L.push(`- ${b.name} (${bb.w}×${bb.d}×${bb.t}mm, 위치 ${r2(bb.x)},${r2(bb.y)},${r2(bb.z)})${b.hidden?" [숨김]":""}`);
    pads.forEach(p=>L.push(`    · ${p.name} [${(KINDS[p.kind]||KINDS.signal).label}${p.face==="bottom"?", 뒷면":", 앞면"}]`));});
  L.push("");L.push(`## 배선 (${wlist().length})`);
  wlist().forEach(w=>{const net=S.nets[w.netId];L.push(`- ${nm(w.a)} ─ ${nm(w.b)}${net?"  (네트: "+net.name+")":"  (네트 없음)"}${w.awg?"  AWG"+w.awg:""}`);});
  L.push("");L.push("## 네트별 연결");
  Object.values(S.nets).forEach(net=>{const ws=wlist().filter(w=>w.netId===net.id);if(!ws.length)return;
    const pins=new Set();ws.forEach(w=>{pins.add(nm(w.a));pins.add(nm(w.b));});
    L.push(`- ${net.name} (${ws.length}선): ${[...pins].join(", ")}`);});
  const wired=new Set();wlist().forEach(w=>{wired.add(w.a);wired.add(w.b);});
  const un=nlist().filter(n=>!wired.has(n.id));
  if(un.length){L.push("");L.push(`## 미연결 패드 (${un.length})`);un.forEach(p=>L.push(`- ${nm(p.id)}`));}
  return L.join("\n");}
// ---- 2D 회로도 ----
function drawSchematic(cvEl){
  const bs=blist().filter(b=>!b.hidden);if(!bs.length)return false;
  // 논리 레이아웃: 실제 mm 대신 IC 심볼 스타일 — 고정폭 박스, 핀은 좌/우 가장자리 일정 간격
  const BW=200,PIN=20,GAPX=170,GAPY=50,M=60,LEG=210;
  const items=bs.map(b=>{const bb=bBox(b);return{b,bb,cx:bb.x+bb.w/2,cy:bb.y+bb.d/2};});
  const cols=[];items.sort((a,b)=>a.cx-b.cx).forEach(it=>{ // x 근접 클러스터로 열 구성(상대 배치 유지)
    const c=cols.find(c=>Math.abs(c.cx-it.cx)<Math.max(35,it.bb.w*0.7));
    if(c){c.list.push(it);c.cx=(c.cx*c.n+it.cx)/(c.n+1);c.n++;}else cols.push({cx:it.cx,n:1,list:[it]});});
  cols.forEach(c=>c.list.sort((a,b)=>a.cy-b.cy));
  const boardPins={};bs.forEach(b=>{const bb=bBox(b);const pads=nlist().filter(n=>n.board===b.id).sort((a,b2)=>a.v-b2.v||a.u-b2.u);
    const L=pads.filter(p=>p.u<bb.w/2),R=pads.filter(p=>p.u>=bb.w/2);
    boardPins[b.id]={L,R,h:Math.max(66,Math.max(L.length,R.length)*PIN+40)};});
  let x=M;const pos={};let totalH=0;
  cols.forEach(c=>{let y=M;c.list.forEach(it=>{const bp=boardPins[it.b.id];pos[it.b.id]={x,y,w:BW,h:bp.h};y+=bp.h+GAPY;});totalH=Math.max(totalH,y);x+=BW+GAPX;});
  const W2=x-GAPX+M+LEG,H2=Math.max(totalH-GAPY+M,340);
  cvEl.width=W2;cvEl.height=H2;const g=cvEl.getContext("2d");
  g.fillStyle="#fdfdf8";g.fillRect(0,0,W2,H2);
  g.strokeStyle="#e6e6da";g.lineWidth=1;for(let gx=0;gx<W2-LEG;gx+=25){g.beginPath();g.moveTo(gx,0);g.lineTo(gx,H2);g.stroke();}for(let gy=0;gy<H2;gy+=25){g.beginPath();g.moveTo(0,gy);g.lineTo(W2-LEG,gy);g.stroke();}
  // 핀 좌표 (박스 밖 6px)
  const padXY={};bs.forEach(b=>{const p=pos[b.id],bp=boardPins[b.id];
    bp.L.forEach((n,i)=>{padXY[n.id]=[p.x-6,p.y+34+i*PIN,n.face,b.id,"L"];});
    bp.R.forEach((n,i)=>{padXY[n.id]=[p.x+p.w+6,p.y+34+i*PIN,n.face,b.id,"R"];});});
  // 보드 박스 + 이름 + 핀 스텁/라벨(박스 안쪽)
  bs.forEach(b=>{const p=pos[b.id],bp=boardPins[b.id];
    g.fillStyle="#eef3ec";g.strokeStyle="#3a4a3f";g.lineWidth=2;g.beginPath();g.roundRect(p.x,p.y,p.w,p.h,8);g.fill();g.stroke();
    g.fillStyle="#2f4437";g.font="bold 13px sans-serif";g.textAlign="left";g.textBaseline="top";g.fillText(b.name,p.x+8,p.y+7,p.w-16);
    g.strokeStyle="#8a9a8f";g.lineWidth=1;g.beginPath();g.moveTo(p.x+6,p.y+25);g.lineTo(p.x+p.w-6,p.y+25);g.stroke();
    g.font="11px sans-serif";g.textBaseline="middle";
    bp.L.forEach((n,i)=>{const py=p.y+34+i*PIN;g.strokeStyle="#3a4a3f";g.lineWidth=1.6;g.beginPath();g.moveTo(p.x-6,py);g.lineTo(p.x,py);g.stroke();
      g.fillStyle="#333";g.textAlign="left";g.fillText(n.name,p.x+7,py,BW/2-12);});
    bp.R.forEach((n,i)=>{const py=p.y+34+i*PIN;g.strokeStyle="#3a4a3f";g.lineWidth=1.6;g.beginPath();g.moveTo(p.x+p.w,py);g.lineTo(p.x+p.w+6,py);g.stroke();
      g.fillStyle="#333";g.textAlign="right";g.fillText(n.name,p.x+p.w-7,py,BW/2-12);});});
  // 배선 — 통로 직각 라우팅 + halo, 병렬선 간격
  const ws=wlist().filter(w=>padXY[w.a]&&padXY[w.b]);
  ws.forEach((w,i)=>{const a=padXY[w.a],b=padXY[w.b];const net=S.nets[w.netId];
    const corr=(a[0]+b[0])/2+((i%11)-5)*7;
    const lw=Math.max(1.8,(AWG[w.awg]||0.6)*2.2);
    const path=()=>{g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(corr,a[1]);g.lineTo(corr,b[1]);g.lineTo(b[0],b[1]);};
    g.lineJoin="round";g.lineCap="round";
    path();g.strokeStyle="rgba(253,253,248,.92)";g.lineWidth=lw+3;g.stroke();
    path();g.strokeStyle=w.color||(net?net.color:"#5a6472");g.lineWidth=lw;
    if(a[2]==="bottom"&&b[2]==="bottom")g.setLineDash([7,4]);
    g.stroke();g.setLineDash([]);});
  // 핀 점 (배선 위)
  Object.entries(padXY).forEach(([id,p])=>{const n=S.nodes[id];if(!n)return;const col=(KINDS[n.kind]||KINDS.signal).color;
    g.beginPath();g.arc(p[0],p[1],4.5,0,7);g.fillStyle=col;g.fill();g.strokeStyle=n.face==="bottom"?"#555":"#fff";g.lineWidth=1.5;g.stroke();
    if(n.face==="bottom"){g.beginPath();g.arc(p[0],p[1],1.8,0,7);g.fillStyle="#fff";g.fill();}});
  // 범례
  const lx=W2-LEG+16;let ly=28;
  g.fillStyle="#222";g.font="bold 13px sans-serif";g.textAlign="left";g.textBaseline="middle";g.fillText("네트",lx,ly);ly+=20;
  Object.values(S.nets).forEach(net=>{const cnt=wlist().filter(w=>w.netId===net.id).length;if(!cnt)return;
    g.strokeStyle=net.color;g.lineWidth=4;g.beginPath();g.moveTo(lx,ly);g.lineTo(lx+26,ly);g.stroke();
    g.fillStyle="#333";g.font="12px sans-serif";g.fillText(`${net.name} (${cnt})`,lx+34,ly);ly+=19;});
  ly+=8;g.fillStyle="#222";g.font="bold 13px sans-serif";g.fillText("패드",lx,ly);ly+=18;
  Object.entries(KINDS).forEach(([k,v])=>{g.beginPath();g.arc(lx+6,ly,5,0,7);g.fillStyle=v.color;g.fill();g.fillStyle="#333";g.font="12px sans-serif";g.fillText(v.label,lx+20,ly);ly+=18;});
  g.beginPath();g.arc(lx+6,ly,5,0,7);g.fillStyle="#999";g.fill();g.strokeStyle="#555";g.stroke();g.beginPath();g.arc(lx+6,ly,2,0,7);g.fillStyle="#fff";g.fill();
  g.fillStyle="#333";g.fillText("뒷면 패드",lx+20,ly);
  g.fillStyle="#777";g.font="11px sans-serif";g.textBaseline="bottom";g.fillText(((S.project&&S.project.name)||"")+"  ·  WireNest",lx,H2-12);
  return true;}
function openSchematic(){const cvEl=document.getElementById("schcv");if(!drawSchematic(cvEl)){toast("보드가 없습니다");return;}document.getElementById("schdlg").hidden=false;}
function exportSchematic(){const oc=document.createElement("canvas");if(!drawSchematic(oc)){toast("보드가 없습니다");return;}
  oc.toBlob(bl=>{const a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=((S.project&&S.project.name)||"harness")+"_schematic.png";a.click();},"image/png");}
async function exportText(){const txt=buildText();
  try{await navigator.clipboard.writeText(txt);toast("배선표 클립보드 복사됨 (AI에 붙여넣기)");}catch(_){toast("배선표 파일 저장");}
  const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=((S.project&&S.project.name)||"harness")+"_wiring.txt";a.click();}
document.getElementById("loadfile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);S.project={name:d.name||baseName(f.name),fileHandle:null,dirty:false};loadData(d);updateProjName();hideHome();}catch(err){alert("불러오기 실패: "+err.message);}};rd.readAsText(f);e.target.value="";});
document.getElementById("imgfile").addEventListener("change",e=>{const f=e.target.files[0];if(!f||!pendingImgBoard)return;const rd=new FileReader();
  rd.onload=()=>{const b=S.boards[pendingImgBoard];if(!b)return;pushUndo();markDirty();if(pendingImgFace==="bottom")b.imgBottom=rd.result;else b.img=rd.result;renderInsp();rebuild();};rd.readAsDataURL(f);e.target.value="";});

// ===== menu & overlays =====
const homeEl=document.getElementById("home"),expEl=document.getElementById("expdlg"),ddEl=document.getElementById("filedd");
function hideHome(){homeEl.hidden=true;}function showHome(){homeEl.hidden=false;document.getElementById("home-newform").hidden=true;}
document.getElementById("filemenu").onclick=e=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();ddEl.style.left=r.left+"px";ddEl.style.top=(r.bottom+4)+"px";ddEl.hidden=!ddEl.hidden;};
document.addEventListener("click",()=>{ddEl.hidden=true;});
ddEl.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ddEl.hidden=true;const a=b.dataset.a;if(a==="new"||a==="home")showHome();else if(a==="open")openProject();else if(a==="save")saveProject();else if(a==="export")expEl.hidden=false;});
document.getElementById("home-new").onclick=()=>{const nf=document.getElementById("home-newform");nf.hidden=false;const i=document.getElementById("home-name");i.value="";i.focus();};
document.getElementById("home-open").onclick=openProject;
document.getElementById("home-create").onclick=()=>newProject(document.getElementById("home-name").value);
document.getElementById("home-name").addEventListener("keydown",e=>{if(e.key==="Enter")newProject(e.target.value);});
document.getElementById("home-cancel").onclick=()=>{document.getElementById("home-newform").hidden=true;};
document.getElementById("home-sample").onclick=loadSample;
document.getElementById("exp-close").onclick=()=>{expEl.hidden=true;};
document.getElementById("exp-file").onclick=()=>{expEl.hidden=true;saveProjectAs();};
document.getElementById("exp-img").onclick=()=>{expEl.hidden=true;exportImage();};
document.getElementById("exp-txt").onclick=()=>{expEl.hidden=true;exportText();};
document.getElementById("exp-sch").onclick=()=>{expEl.hidden=true;exportSchematic();};
document.getElementById("schbtn").onclick=openSchematic;
document.getElementById("sch-close").onclick=()=>{document.getElementById("schdlg").hidden=true;};
document.getElementById("sch-export").onclick=exportSchematic;
document.getElementById("home-fsnote").textContent=hasFS?"":"※ 다운로드 방식으로 저장 (Chrome·Edge 권장)";
document.getElementById("wirestyle").addEventListener("change",e=>{S.wireStyle=e.target.value;rebuild();});
document.getElementById("snapmm").addEventListener("input",e=>{snapMM=Math.max(0,num(e.target.value));tc.setTranslationSnap(snapMM>0?snapMM:null);});
document.getElementById("simbtn").onclick=()=>{S.simulate=!S.simulate;const b=document.getElementById("simbtn");b.classList.toggle("on",S.simulate);b.style.background=S.simulate?"var(--good)":"";b.style.color=S.simulate?"#0a1a0d":"";b.textContent=S.simulate?"■ 종료":"▶ 시뮬";if(S.simulate)nlist().forEach(n=>{n.state=false;});recompute();rebuild();};
document.getElementById("themebtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||"light";document.documentElement.setAttribute("data-theme",cur==="dark"?"light":"dark");themeBG();needRender=true;};
addEventListener("beforeunload",e=>{if(S.project&&S.project.dirty){e.preventDefault();e.returnValue="";}});

// ===== loop =====
function loop(){controls.update();if(needRender){renderer.render(scene,camera);needRender=false;}requestAnimationFrame(loop);}
function init(){S.project={name:"Untitled",fileHandle:null,dirty:false};renderTools();renderViews();renderInsp();updateProjName();resize();setView("iso");showHome();loop();}
init();
