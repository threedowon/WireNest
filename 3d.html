<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WireNest 3D</title>
<style>
  html,body{margin:0;padding:0}
  :root{
    --bg:#0e1116; --panel:#171b22; --panel2:#1e242d; --panel3:#252c37;
    --border:#2a323d; --border2:#37424f;
    --txt:#e6ebf2; --muted:#8b97a7; --faint:#5c6675;
    --accent:#ffb454; --accent-d:#e0952f; --cyan:#4dd0e1;
    --good:#66bb6a; --warn:#ffa726; --bad:#ef5350;
    --shadow:0 6px 24px rgba(0,0,0,.45);
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  :root[data-theme="light"]{--bg:#eef1f5;--panel:#fff;--panel2:#f4f6f9;--panel3:#e9edf2;--border:#d6dde6;--border2:#c3ccd8;--txt:#1a2230;--muted:#5b6675;--faint:#95a0b0;--shadow:0 6px 24px rgba(30,45,70,.12);}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  #app{height:100vh;width:100%;display:grid;grid-template-columns:52px 1fr 300px;grid-template-rows:46px 1fr 26px;
    grid-template-areas:"top top top" "tools canvas insp" "tools status status";background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;overflow:hidden;}
  #top{grid-area:top;display:flex;align-items:center;gap:9px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);overflow:hidden}
  .brand{display:flex;align-items:center;gap:8px;font-weight:650;white-space:nowrap}
  .brand .dot{width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--muted);padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;border-right:1px solid var(--border)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:#1a1205;font-weight:600}
  .spacer{flex:1}
  .tbtn{border:1px solid var(--border);background:var(--panel2);color:var(--txt);padding:5px 9px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .tbtn:hover{background:var(--panel3);border-color:var(--border2)}
  .tbtn.warn:hover{border-color:var(--bad);color:var(--bad)}
  .field{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;white-space:nowrap}
  input,select{background:var(--panel2);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:4px 6px;font:inherit;font-size:12px;font-family:var(--mono)}
  input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  input[type=checkbox]{accent-color:var(--accent);width:auto}
  input[type=color]{padding:1px;width:30px;height:26px;cursor:pointer}
  #tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
  .tool{width:38px;height:38px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
  .tool svg{width:19px;height:19px}
  .tool:hover{background:var(--panel2);color:var(--txt)}
  .tool.on{background:var(--accent);color:#1a1205;border-color:var(--accent-d)}
  .tool .kbd{position:absolute;bottom:2px;right:3px;font-size:8px;font-family:var(--mono);opacity:.6}
  .toolsep{width:24px;height:1px;background:var(--border);margin:4px 0}
  #canvas-wrap{grid-area:canvas;position:relative;overflow:hidden;background:var(--bg)}
  #cv{position:absolute;inset:0;display:block;touch-action:none}
  #tip{position:absolute;left:12px;bottom:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--muted);font-size:11px;pointer-events:none;box-shadow:var(--shadow);max-width:460px;line-height:1.5}
  #tip b{color:var(--txt)} #tip kbd{font-family:var(--mono);background:var(--panel3);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-size:10px;color:var(--txt)}
  #insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;overflow-x:hidden}
  .sec{border-bottom:1px solid var(--border);padding:12px 13px}
  .sec h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:650;display:flex;align-items:center;justify-content:space-between}
  .sec h3 .badge{background:var(--panel3);color:var(--muted);border-radius:20px;padding:1px 8px;font-size:10px;letter-spacing:0}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .row label{width:60px;color:var(--muted);font-size:11px;flex-shrink:0}
  .row .grow{flex:1;min-width:0}
  .row input[type=text],.row select,.row input.mm{width:100%}
  .duo{display:flex;gap:6px}.duo input{width:100%}.trio{display:flex;gap:5px}.trio input{width:100%}
  .empty{color:var(--faint);font-size:12px;text-align:center;padding:24px 8px;line-height:1.6}
  .btn-full{width:100%;justify-content:center;margin-top:4px}
  .chiplist{display:flex;flex-direction:column;gap:5px}
  .chip{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;font-size:12px}
  .chip:hover{border-color:var(--border2)}.chip.on{border-color:var(--accent);background:var(--panel3)}
  .chip .sw{width:14px;height:14px;border-radius:4px;flex-shrink:0;border:1px solid rgba(255,255,255,.15)}
  .chip .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .ct{color:var(--muted);font-family:var(--mono);font-size:10px}
  .chip .x{color:var(--faint);padding:0 2px}.chip .x:hover{color:var(--bad)}
  .miniadd{display:flex;gap:6px;margin-top:8px}.miniadd input{flex:1;width:auto}
  .facegrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .facegrid button,.kindgrid button{border:1px solid var(--border);background:var(--panel2);color:var(--txt);border-radius:7px;padding:6px 4px;cursor:pointer;font:inherit;font-size:11px;display:flex;align-items:center;justify-content:center;gap:5px}
  .facegrid button.on,.kindgrid button.on{border-color:var(--accent);background:var(--panel3)}
  .kindgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .kindgrid button .d{width:9px;height:9px;border-radius:50%}
  .hint{color:var(--faint);font-size:10.5px;line-height:1.5;margin-top:6px}
  #status{grid-area:status;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 12px;color:var(--muted);font-size:11px;font-family:var(--mono);overflow:hidden}
  #status .k{color:var(--faint)} #status .val{color:var(--txt)} #status .simon{color:var(--good)}
  .divv{width:1px;height:14px;background:var(--border)}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
  .menuwrap{position:relative}
  .dropdown{position:fixed;min-width:196px;background:var(--panel);border:1px solid var(--border2);border-radius:10px;box-shadow:var(--shadow);padding:5px;z-index:55}
  .dropdown button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;background:transparent;border:0;color:var(--txt);font:inherit;font-size:13px;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left}
  .dropdown button:hover{background:var(--panel3)} .dropdown button .sc{color:var(--faint);font-family:var(--mono);font-size:11px}
  .dd-sep{height:1px;background:var(--border);margin:4px 6px}
  #projname{font-weight:600;color:var(--txt);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  #projname .dirty{color:var(--accent)}
  .overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(6,9,13,.72);backdrop-filter:blur(3px)}
  .overlay[hidden]{display:none}
  :root[data-theme="light"] .overlay{background:rgba(226,232,240,.78)}
  .home-card,.modal-card{background:var(--panel);border:1px solid var(--border2);border-radius:16px;box-shadow:var(--shadow);padding:32px 34px;width:min(440px,92vw);position:relative}
  .home-brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
  .home-brand .dot{width:12px;height:12px;border-radius:3px;background:var(--accent);box-shadow:0 0 14px var(--accent)}
  .home-brand small{font-size:12px;color:var(--muted);font-weight:500}
  .home-sub{color:var(--muted);font-size:12.5px;margin:8px 0 22px;line-height:1.55}
  .home-actions,.modal-actions{display:flex;gap:10px}
  .home-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:15px;border-radius:11px;border:1px solid var(--border2);background:var(--panel2);color:var(--txt);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .home-btn small{font-weight:400;font-size:11px;color:var(--muted)}
  .home-btn:hover{border-color:var(--accent);background:var(--panel3)}
  .home-btn.primary{background:var(--accent);color:#1a1205;border-color:var(--accent-d)}
  .home-btn.primary small{color:#5a3d0a} .home-btn.primary:hover{background:var(--accent-d)}
  .home-btn.ghost{flex:0 0 auto;background:transparent;border-color:var(--border);font-weight:500}
  .home-newform{display:flex;gap:8px;margin-top:14px}
  .home-newform input{flex:1;font-size:14px;padding:11px 12px;font-family:var(--sans)}
  .home-newform .home-btn{flex:0 0 auto;flex-direction:row;padding:0 16px}
  .home-foot{margin-top:22px;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .home-foot a{color:var(--cyan);cursor:pointer}.home-foot a:hover{text-decoration:underline}
  .modal-card h3{margin:0 0 6px;font-size:17px}.modal-card p{margin:0 0 18px;color:var(--muted);font-size:13px}
  .modal-x{position:absolute;top:12px;right:14px;background:transparent;border:0;color:var(--muted);font-size:15px;cursor:pointer}
  .modal-x:hover{color:var(--txt)}
  @media (max-width:900px){#app{grid-template-columns:46px 1fr;grid-template-areas:"top top" "tools canvas" "status status"}#insp{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand"><span class="dot"></span>WireNest <small style="color:var(--cyan);font-weight:600">3D</small></div>
    <div class="menuwrap"><button class="tbtn" id="filemenu">파일 ▾</button>
      <div class="dropdown" id="filedd" hidden>
        <button data-a="new">새 프로젝트</button><button data-a="open">열기…</button>
        <button data-a="save">저장<span class="sc">Ctrl+S</span></button>
        <div class="dd-sep"></div><button data-a="export">내보내기…</button>
        <div class="dd-sep"></div><button data-a="home">홈 화면</button>
      </div></div>
    <span id="projname"></span>
    <div class="seg" id="viewseg"></div>
    <div class="field">배선 <select id="wirestyle"><option value="curve">곡선</option><option value="straight">직선</option></select></div>
    <div class="field">스냅 <input id="snapmm" type="number" min="0" step="0.5" value="1" style="width:50px"> mm</div>
    <div class="spacer"></div>
    <button class="tbtn" id="simbtn">▶ 시뮬</button>
    <div class="divv"></div>
    <button class="tbtn" id="themebtn" title="테마">◐</button>
    <input type="file" id="loadfile" accept="application/json,.wnest" hidden>
    <input type="file" id="imgfile" accept="image/*" hidden>
  </div>
  <div id="tools"></div>
  <div id="canvas-wrap"><canvas id="cv"></canvas><div id="tip"></div></div>
  <div id="insp"></div>
  <div id="status">
    <span><span class="k">뷰</span> <span class="val" id="st-view">3D</span></span>
    <span><span class="k">보드</span> <span class="val" id="st-boards">0</span></span>
    <span><span class="k">패드</span> <span class="val" id="st-nodes">0</span></span>
    <span><span class="k">배선</span> <span class="val" id="st-wires">0</span></span>
    <span class="divv"></span><span id="st-sel" class="val">선택 없음</span>
    <span class="spacer" style="flex:1"></span><span id="st-mode"></span>
  </div>
  <div id="home" class="overlay">
    <div class="home-card">
      <div class="home-brand"><span class="dot"></span>WireNest <small>3D 하네스 에디터</small></div>
      <p class="home-sub">PCB 배치·배선을 <b>실제 3D</b>로 계획하고, <b>.wnest</b> 프로젝트 파일로 저장하세요. (index.html과 데이터 호환)</p>
      <div class="home-actions">
        <button id="home-new" class="home-btn primary">＋ 새 프로젝트<small>이름을 정해 시작</small></button>
        <button id="home-open" class="home-btn">📂 열기<small>.wnest 파일 불러오기</small></button>
      </div>
      <div id="home-newform" class="home-newform" hidden>
        <input id="home-name" type="text" placeholder="프로젝트 이름" maxlength="60">
        <button id="home-create" class="home-btn primary">만들기</button>
        <button id="home-cancel" class="home-btn ghost">취소</button>
      </div>
      <div class="home-foot"><a id="home-sample">예제로 시작 →</a><span id="home-fsnote"></span></div>
    </div>
  </div>
  <div id="expdlg" class="overlay" hidden>
    <div class="modal-card"><button id="exp-close" class="modal-x">✕</button>
      <h3>내보내기</h3><p>무엇으로 내보낼까요?</p>
      <div class="modal-actions">
        <button id="exp-file" class="home-btn primary">프로젝트 파일<small>.wnest · 다시 편집 가능</small></button>
        <button id="exp-img" class="home-btn">PNG 이미지<small>보기·공유용</small></button>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';

// ===== constants =====
const AWG={30:0.255,28:0.321,26:0.405,24:0.511,22:0.644,20:0.812,18:1.024,16:1.291,14:1.628,12:2.053};
const KINDS={input:{label:"입력",color:"#4dd0e1"},output:{label:"출력",color:"#ffb454"},power:{label:"전원",color:"#ef5350"},gnd:{label:"GND",color:"#78909c"},signal:{label:"신호",color:"#ab47bc"}};
const NETCOLORS=["#ef5350","#ffa726","#ffee58","#66bb6a","#26c6da","#42a5f5","#7e57c2","#ec407a","#8d6e63","#bdbdbd"];
const FACES=[["top","앞면"],["bottom","뒷면"]];
const VIEWS=[["iso","3D"],["top","Top"],["front","Front"],["back","Back"],["left","Left"],["right","Right"],["bottom","Bottom"]];
const VIEWDIR={iso:[1,0.9,1],top:[0,1,0.0001],bottom:[0,-1,0.0001],front:[0,0.25,1],back:[0,0.25,-1],left:[-1,0.25,0],right:[1,0.25,0]};
let uid=1; const nid=()=>"i"+(uid++);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const r2=n=>Math.round(n*10)/10;

const S={boards:{},nodes:{},wires:{},nets:{},view:"iso",tool:"select",wireStyle:"curve",
  sel:null,wireStart:null,simulate:false,activeNet:null,defaultAwg:22,defaultNet:null,project:null};
let LIT={n:new Set(),w:new Set()};
let snapMM=1; const snapv=v=>snapMM>0?Math.round(v/snapMM)*snapMM:v;
const texCache={}; let pendingImgBoard=null,pendingImgFace="top";
const blist=()=>Object.values(S.boards),nlist=()=>Object.values(S.nodes),wlist=()=>Object.values(S.wires);

// ===== three setup =====
const cv=document.getElementById("cv"),wrap=document.getElementById("canvas-wrap");
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
let W=1,H=1,frust=140;
const camera=new THREE.OrthographicCamera(-1,1,1,-1,-5000,5000);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.12;controls.screenSpacePanning=true;
controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.PAN,RIGHT:THREE.MOUSE.PAN};
cv.addEventListener("mousedown",e=>{if(e.button===1)e.preventDefault();}); // 가운데 버튼 자동스크롤 방지 → 팬 확실히
controls.addEventListener("change",()=>{needRender=true;});
// 이동 기즈모
const gizmo=new THREE.Object3D();scene.add(gizmo);
let gizmoDragging=false;
const tc=new TransformControls(camera,renderer.domElement);tc.setSize(0.85);tc.setTranslationSnap(snapMM>0?snapMM:null);scene.add(tc);
tc.addEventListener("change",()=>{needRender=true;});
tc.addEventListener("dragging-changed",e=>{gizmoDragging=e.value;controls.enabled=!e.value;if(e.value)pushUndo();else{markDirty();renderInsp();placeGizmo();}needRender=true;});
tc.addEventListener("objectChange",()=>{applyGizmoToData();rebuild();needRender=true;});
function placeGizmo(){if(gizmoDragging)return;if(!S.sel||(S.sel.t!=="board"&&S.sel.t!=="node")){tc.detach();return;}
  if(S.sel.t==="board"){const b=S.boards[S.sel.id];if(!b){tc.detach();return;}const bb=bBox(b);gizmo.position.set(bb.x+bb.w/2,bb.z+bb.t/2,bb.y+bb.d/2);tc.showX=tc.showY=tc.showZ=true;}
  else{const n=S.nodes[S.sel.id];if(!n||!n.board){tc.detach();return;}gizmo.position.copy(padVec(n));tc.showX=true;tc.showZ=true;tc.showY=false;}
  tc.attach(gizmo);}
function applyGizmoToData(){if(!S.sel)return;
  if(S.sel.t==="board"){const b=S.boards[S.sel.id];if(!b)return;const bb=bBox(b);b.x=r2(gizmo.position.x-bb.w/2);b.z=r2(gizmo.position.y-bb.t/2);b.y=r2(gizmo.position.z-bb.d/2);}
  else if(S.sel.t==="node"){const n=S.nodes[S.sel.id];if(!n||!n.board)return;const bb=bBox(S.boards[n.board]);let dx=gizmo.position.x,dy=gizmo.position.z;if(bb.rot){const cx=bb.x+bb.w/2,cy=bb.y+bb.d/2;[dx,dy]=rotZ(dx,dy,cx,cy,-bb.rot);}n.u=r2(Math.max(0,Math.min(bb.w,dx-bb.x)));n.v=r2(Math.max(0,Math.min(bb.d,dy-bb.y)));}}
scene.add(new THREE.AmbientLight(0xffffff,0.62));
const dl=new THREE.DirectionalLight(0xffffff,0.9); dl.position.set(60,120,40); scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.28); dl2.position.set(-50,40,-60); scene.add(dl2);
const grid=new THREE.GridHelper(600,60,0x2a323d,0x1a2029); scene.add(grid);
const boardG=new THREE.Group(),padG=new THREE.Group(),wireG=new THREE.Group(),labelG=new THREE.Group();
scene.add(boardG,padG,wireG,labelG);
let needRender=true;
function themeBG(){const c=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();scene.background=new THREE.Color(c||"#0e1116");}
themeBG();

function resize(){const r=wrap.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);
  renderer.setSize(W,H,false);const asp=W/H;camera.left=-frust*asp/2;camera.right=frust*asp/2;camera.top=frust/2;camera.bottom=-frust/2;camera.updateProjectionMatrix();needRender=true;}
new ResizeObserver(resize).observe(wrap);

// ===== coord mapping: data(x,y,z; z up) -> three(x, z, y) [three Y = up = data z] =====
function bBox(b){return {x:b.x,y:b.y,z:b.z||0,w:b.w,d:b.d!=null?b.d:(b.h||30),t:b.thick||1.6,rot:b.rot||0};}
function rotZ(x,y,cx,cy,deg){const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a),dx=x-cx,dy=y-cy;return [cx+dx*c-dy*s,cy+dx*s+dy*c];}
function padData(p){ // returns data-space world [x,y,z]
  const b=S.boards[p.board]; if(!b)return[p.wx||0,p.wy||0,p.wz||0];
  const {x,y,z,w,d,t,rot}=bBox(b);
  let wx=x+p.u,wy=y+p.v,wz=(p.face==="bottom")?z:z+t;
  if(rot){const cx=x+w/2,cy=y+d/2;[wx,wy]=rotZ(wx,wy,cx,cy,rot);}
  return [wx,wy,wz];
}
function padDataOff(p,du,dv){const b=S.boards[p.board];if(!b)return padData(p);const {x,y,z,w,d,t,rot}=bBox(b);let wx=x+p.u+du,wy=y+p.v+dv,wz=(p.face==="bottom")?z:z+t;if(rot){const cx=x+w/2,cy=y+d/2;[wx,wy]=rotZ(wx,wy,cx,cy,rot);}return [wx,wy,wz];}
const toThree=(x,y,z)=>new THREE.Vector3(x,z,y);        // data->three
const padVec=p=>{const d=padData(p);return toThree(d[0],d[1],d[2]);};

// ===== build scene from state =====
const disposeGroup=g=>{while(g.children.length){const o=g.children.pop();o.geometry&&o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{m.map&&!m.map.__cached&&m.map.dispose();m.dispose();});}}};
function makeLabel(text,worldScale,col){const c=document.createElement("canvas"),x=c.getContext("2d");x.font="bold 40px sans-serif";const tw=x.measureText(text).width;c.width=Math.ceil(tw)+18;c.height=52;
  x.font="bold 40px sans-serif";x.fillStyle="rgba(0,0,0,0.5)";x.fillRect(0,0,c.width,c.height);x.fillStyle=col||"#fff";x.textBaseline="middle";x.fillText(text,9,c.height/2+1);
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));
  sp.scale.set(worldScale*c.width/c.height,worldScale,1);sp.renderOrder=10;return sp;}
function makeSilk(text){const c=document.createElement("canvas"),x=c.getContext("2d");x.font="bold 40px sans-serif";const tw=Math.max(24,x.measureText(text).width);c.width=Math.ceil(tw)+10;c.height=46;
  x.font="bold 40px sans-serif";x.fillStyle="rgba(233,239,245,0.95)";x.textBaseline="middle";x.textAlign="center";x.fillText(text,c.width/2,c.height/2+1);
  const tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;tex.colorSpace=THREE.SRGBColorSpace;
  const wmm=1.8,geo=new THREE.PlaneGeometry(wmm*c.width/c.height,wmm);
  return new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false}));}
function rebuild(){
  disposeGroup(boardG);disposeGroup(padG);disposeGroup(wireG);disposeGroup(labelG);
  const selId=S.sel?S.sel.id:null;
  for(const b of blist()){const {x,y,z,w,d,t,rot}=bBox(b);
    const geo=new THREE.BoxGeometry(w,t,d);
    const side=new THREE.MeshLambertMaterial({color:new THREE.Color(b.color||"#1c5e38")});
    const faceMat=(url,key)=>{if(!url)return side;let tex=texCache[key];if(!tex||tex.__url!==url){if(tex)tex.dispose();tex=new THREE.TextureLoader().load(url,()=>{needRender=true;});tex.colorSpace=THREE.SRGBColorSpace;tex.__url=url;tex.__cached=true;texCache[key]=tex;}return new THREE.MeshLambertMaterial({map:tex});};
    const mats=[side,side,faceMat(b.img,b.id+":top"),faceMat(b.imgBottom,b.id+":bot"),side,side]; // +X,-X,+Y(앞면),-Y(뒷면),+Z,-Z
    const m=new THREE.Mesh(geo,mats);
    m.position.set(x+w/2,z+t/2,y+d/2);m.rotation.y=-(rot||0)*Math.PI/180;
    m.userData={kind:"board",id:b.id};boardG.add(m);
    if(S.sel&&S.sel.t==="board"&&b.id===selId){const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xffb454}));e.position.copy(m.position);e.rotation.copy(m.rotation);boardG.add(e);}
    const lab=makeLabel(b.name,2.6,"#cfe");lab.position.set(x+w/2,z+t+2.1,y+d/2);labelG.add(lab);
  }
  for(const n of nlist()){const v=padVec(n),col=KINDS[n.kind].color;
    const lit=LIT.n.has(n.id);
    const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(lit?"#fff2c4":col),emissive:new THREE.Color(lit?col:"#000"),emissiveIntensity:lit?0.7:0,metalness:0.1,roughness:0.5});
    const m=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,1.4,18),mat);
    m.position.copy(v);if(n.face==="bottom")m.position.y-=0.7;else m.position.y+=0.7;
    m.userData={kind:"pad",id:n.id};padG.add(m);
    if(S.sel&&S.sel.t==="node"&&n.id===selId){const r=new THREE.Mesh(new THREE.TorusGeometry(3.4,0.5,8,20),new THREE.MeshBasicMaterial({color:0xffb454}));r.position.copy(m.position);r.rotation.x=Math.PI/2;padG.add(r);}
    if(n.board){ // 실크스크린: 패드 아래에 보드 면에 새겨진 라벨
      const ld=padDataOff(n,0,3.2),lv=toThree(ld[0],ld[1],ld[2]),silk=makeSilk(n.name);
      silk.position.copy(lv);silk.position.y+=(n.face==="bottom"?-0.06:0.06);
      silk.rotation.order="YXZ";silk.rotation.y=-((S.boards[n.board]&&S.boards[n.board].rot)||0)*Math.PI/180;silk.rotation.x=(n.face==="bottom"?Math.PI/2:-Math.PI/2);
      labelG.add(silk);
    }
  }
  for(const w of wlist()){const a=S.nodes[w.a],b=S.nodes[w.b];if(!a||!b)continue;
    const pa=padVec(a),pb=padVec(b);const net=S.nets[w.netId];
    const lit=LIT.w.has(w.id);
    const col=lit?"#fff2c4":(w.color||(net?net.color:"#8b97a7"));
    const rad=Math.max(0.5,(AWG[w.awg]||0.6)*0.5);
    let curve;
    if(S.wireStyle==="straight"){curve=new THREE.LineCurve3(pa,pb);}
    else{const mid=pa.clone().add(pb).multiplyScalar(0.5);mid.y+=Math.min(40,Math.max(6,pa.distanceTo(pb)*0.28));curve=new THREE.QuadraticBezierCurve3(pa,mid,pb);}
    const geo=new THREE.TubeGeometry(curve,S.wireStyle==="straight"?1:20,rad,8,false);
    const mat=new THREE.MeshStandardMaterial({color:new THREE.Color(col),emissive:new THREE.Color(lit?col:"#000"),emissiveIntensity:lit?0.6:0,metalness:0.2,roughness:0.5});
    const m=new THREE.Mesh(geo,mat);
    const dim=S.activeNet&&w.netId!==S.activeNet;if(dim){mat.transparent=true;mat.opacity=0.25;}
    if(S.sel&&S.sel.t==="wire"&&w.id===S.sel.id){mat.emissive=new THREE.Color(0xffb454);mat.emissiveIntensity=0.5;}
    m.userData={kind:"wire",id:w.id};wireG.add(m);
  }
  needRender=true;updateStatus();placeGizmo();
}

// ===== picking =====
const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();
function setNDC(e){const r=cv.getBoundingClientRect();ndc.x=((e.clientX-r.left)/r.width)*2-1;ndc.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(ndc,camera);}
function pick(prefer){ // prefer 'pad'|'board'|null
  const groups=prefer==="pad"?[padG]:prefer==="board"?[boardG]:[padG,wireG,boardG];
  for(const g of groups){const hit=ray.intersectObjects(g.children.filter(o=>o.userData&&o.userData.kind),false);
    if(hit.length)return {ud:hit[0].object.userData,point:hit[0].point};}
  return null;
}
function groundPoint(){const pl=new THREE.Plane(new THREE.Vector3(0,1,0),0);const pt=new THREE.Vector3();return ray.ray.intersectPlane(pl,pt)?pt:null;}

// ===== interaction =====
let downPos=null;
cv.addEventListener("pointerdown",e=>{downPos={x:e.clientX,y:e.clientY};});
cv.addEventListener("pointerup",e=>{
  if(!downPos)return;const moved=Math.hypot(e.clientX-downPos.x,e.clientY-downPos.y);downPos=null;
  if(moved>4)return; // drag = orbit, not click
  setNDC(e);
  if(S.simulate){const h=pick("pad");if(h&&h.ud.kind==="pad"){const n=S.nodes[h.ud.id];if(n&&n.kind==="input"){n.state=!n.state;recompute();rebuild();}}return;}
  if(S.tool==="wire"){const h=pick("pad");if(h&&h.ud.kind==="pad"){if(!S.wireStart)S.wireStart=h.ud.id;else if(S.wireStart!==h.ud.id){addWire(S.wireStart,h.ud.id);S.wireStart=e.shiftKey?h.ud.id:null;}}else S.wireStart=null;updateStatus();return;}
  if(S.tool==="pad"){const h=pick("board");if(h&&h.ud.kind==="board"){addPadAt(S.boards[h.ud.id],h.point);}else toast("보드 위를 클릭해 패드를 놓으세요");return;}
  if(S.tool==="board"){const p=groundPoint();if(p)addBoard(p.x,p.z);return;}
  // select
  const h=pick(null);
  if(h){select(h.ud.kind==="board"?"board":h.ud.kind==="wire"?"wire":"node",h.ud.id);}
  else select(null);
});
addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==="s"||e.key==="S")){e.preventDefault();saveProject();return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==="z"||e.key==="Z")){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&(e.key==="y"||e.key==="Y")){e.preventDefault();redo();return;}
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  const map={v:"select",b:"board",p:"pad",w:"wire"};if(map[e.key]){S.tool=map[e.key];S.wireStart=null;renderTools();updateStatus();}
  if(e.key==="Delete"||e.key==="Backspace")delSel();
  if(e.key==="Escape"){S.wireStart=null;select(null);}
  if(e.key==="f")fitView();
  const vk={"1":"iso","2":"top","3":"front","4":"left","5":"right","6":"back","7":"bottom"};if(vk[e.key])setView(vk[e.key]);
});

// ===== CRUD =====
function markDirty(){if(S.project){S.project.dirty=true;updateProjName();}}
let undoStack=[],redoStack=[];
function snapState(){return JSON.stringify({boards:S.boards,nodes:S.nodes,wires:S.wires,nets:S.nets,uid,defaultNet:S.defaultNet});}
function pushUndo(){undoStack.push(snapState());if(undoStack.length>80)undoStack.shift();redoStack=[];}
function restoreState(str){const d=JSON.parse(str);S.boards=d.boards;S.nodes=d.nodes;S.wires=d.wires;S.nets=d.nets;uid=d.uid||uid;S.defaultNet=d.defaultNet||null;}
function undo(){if(!undoStack.length){toast("되돌릴 항목 없음");return;}redoStack.push(snapState());restoreState(undoStack.pop());S.sel=null;markDirty();recompute();renderInsp();rebuild();toast("실행취소");}
function redo(){if(!redoStack.length)return;undoStack.push(snapState());restoreState(redoStack.pop());S.sel=null;markDirty();recompute();renderInsp();rebuild();toast("다시실행");}
let _po=false;function pushOnce(){if(!_po){pushUndo();_po=true;setTimeout(()=>_po=false,450);}}
function addBoard(x,z){pushUndo();markDirty();const id=nid();S.boards[id]={id,name:"Board "+(blist().length+1),x:snapv(x-20),y:snapv(z-15),z:0,w:40,d:30,thick:1.6,rot:0,color:"#1c5e38"};
  S.tool="select";renderTools();select("board",id);rebuild();}
function addPadAt(b,point){pushUndo();markDirty();const id=nid();
  // point is three world on the board mesh; convert to data-local u,v on top face
  const {x,y,z,w,d,t,rot}=bBox(b);let dx=point.x,dy=point.z; // three x/z -> data x/y
  if(rot){const cx=x+w/2,cy=y+d/2;[dx,dy]=rotZ(dx,dy,cx,cy,-rot);}
  let u=Math.max(1,Math.min(w-1,dx-x)),v=Math.max(1,Math.min(d-1,dy-y));
  const face=point.y<z+t/2?"bottom":"top";
  const cnt=nlist().filter(n=>n.board===b.id).length+1;
  S.nodes[id]={id,board:b.id,face,u:snapv(u),v:snapv(v),name:"P"+cnt,kind:"signal",state:false};
  select("node",id);rebuild();
}
function addWire(a,b){if(a===b)return;if(wlist().some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a)))return;pushUndo();markDirty();
  const id=nid();S.wires[id]={id,a,b,awg:S.defaultAwg,netId:S.defaultNet,color:null};recompute();rebuild();toast("배선 추가됨");}
function addNet(name,color){const id=nid();S.nets[id]={id,name:name||("Net "+(Object.keys(S.nets).length+1)),color:color||NETCOLORS[Object.keys(S.nets).length%NETCOLORS.length]};if(!S.defaultNet)S.defaultNet=id;return id;}
function delSel(){if(!S.sel)return;pushUndo();markDirty();
  if(S.sel.t==="board"){const bid=S.sel.id;nlist().forEach(n=>{if(n.board===bid){wlist().forEach(w=>{if(w.a===n.id||w.b===n.id)delete S.wires[w.id];});delete S.nodes[n.id];}});delete S.boards[bid];}
  else if(S.sel.t==="node"){const id=S.sel.id;wlist().forEach(w=>{if(w.a===id||w.b===id)delete S.wires[w.id];});delete S.nodes[id];}
  else if(S.sel.t==="wire")delete S.wires[S.sel.id];
  select(null);recompute();rebuild();}
function select(t,id){S.sel=t?{t,id}:null;renderInsp();rebuild();}
function recompute(){LIT=litSet();}
function litSet(){if(!S.simulate)return{n:new Set(),w:new Set()};const adj={};nlist().forEach(n=>adj[n.id]=[]);
  wlist().forEach(w=>{if(adj[w.a]&&adj[w.b]){adj[w.a].push({w:w.id,o:w.b});adj[w.b].push({w:w.id,o:w.a});}});
  const litN=new Set(),litW=new Set(),q=[];nlist().forEach(n=>{if(n.kind==="input"&&n.state){litN.add(n.id);q.push(n.id);}});
  while(q.length){const c=q.pop();for(const e of adj[c]){litW.add(e.w);if(!litN.has(e.o)){litN.add(e.o);q.push(e.o);}}}return{n:litN,w:litW};}

// ===== view =====
function sceneCenterRadius(){const box=new THREE.Box3();let has=false;
  boardG.children.forEach(o=>{if(o.userData&&o.userData.kind==="board"){box.expandByObject(o);has=true;}});
  if(!has)return{c:new THREE.Vector3(0,0,0),r:60};const c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());return{c,r:Math.max(30,sz.length()/2)};}
function setView(v){S.view=v;const{c,r}=sceneCenterRadius();const d=VIEWDIR[v]||VIEWDIR.iso;const dir=new THREE.Vector3(d[0],d[1],d[2]).normalize();
  controls.target.copy(c);camera.position.copy(c).add(dir.multiplyScalar(r*3+150));camera.up.set(0,1,0);controls.update();
  frust=r*2.4;resize();document.querySelectorAll("#viewseg button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));updateStatus();}

const h=html=>{const d=document.createElement("div");d.innerHTML=html;return d.firstElementChild;};

function inspWire(){const w=S.wires[S.sel.id],a=S.nodes[w.a],b=S.nodes[w.b];
  const netopts=`<option value="">— 없음 —</option>`+Object.values(S.nets).map(n=>`<option value="${n.id}" ${w.netId===n.id?'selected':''}>${esc(n.name)}</option>`).join("");
  const awgopts=Object.keys(AWG).map(g=>`<option value="${g}" ${+w.awg===+g?'selected':''}>AWG ${g} · ⌀${AWG[g]}mm</option>`).join("");
  const s=h(`<div class="sec"><h3>배선 <span class="badge">${a?esc(a.name):'?'} → ${b?esc(b.name):'?'}</span></h3>
   <div class="row"><label>네트</label><select class="grow" id="w-net">${netopts}</select></div>
   <div class="row"><label>AWG</label><select class="grow" id="w-awg">${awgopts}</select></div>
   <div class="row"><label>색상</label><input id="w-col" type="color" value="${w.color||'#ffee58'}"><label style="width:auto;margin-left:4px"><input type="checkbox" id="w-colon" ${w.color?'checked':''}> 개별색</label></div>
   <div class="row" style="margin-top:6px"><button class="tbtn warn btn-full" id="w-del">배선 삭제</button></div></div>`);
  insp.appendChild(s);const $=id=>s.querySelector("#"+id);
  bind($("w-net"),"change",e=>{pushUndo();w.netId=e.target.value||null;S.defaultNet=w.netId;markDirty();rebuild();});
  bind($("w-awg"),"change",e=>{pushUndo();w.awg=+e.target.value;S.defaultAwg=+e.target.value;markDirty();rebuild();});
  bind($("w-colon"),"change",e=>{pushUndo();w.color=e.target.checked?$("w-col").value:null;markDirty();rebuild();});
  bind($("w-col"),"input",e=>{if($("w-colon").checked){pushOnce();w.color=e.target.value;markDirty();rebuild();}});
  bind($("w-del"),"click",delSel);}
function inspNets(){const rows=Object.values(S.nets).map(n=>{const cnt=wlist().filter(w=>w.netId===n.id).length;
  return `<div class="chip ${S.activeNet===n.id?'on':''}" data-net="${n.id}"><span class="sw" style="background:${n.color}"></span><span class="nm">${esc(n.name)}</span><span class="ct">${cnt}선</span><span class="x" data-del="${n.id}">✕</span></div>`;}).join("");
  const s=h(`<div class="sec"><h3>네트 <span class="badge">같은 선 묶음</span></h3><div class="chiplist">${rows||'<div class="hint">네트 없음</div>'}</div>
   <div class="miniadd"><input id="net-name" type="text" placeholder="네트 이름 (예: DQ)"><button class="tbtn" id="net-add">추가</button></div>
   <div class="hint">이름 클릭=하이라이트 · ✕=삭제. 배선 선택 후 네트 지정.</div></div>`);
  insp.appendChild(s);
  s.querySelectorAll(".chip").forEach(c=>bind(c,"click",e=>{if(e.target.dataset.del!==undefined)return;const id=c.dataset.net;S.activeNet=S.activeNet===id?null:id;renderInsp();rebuild();}));
  s.querySelectorAll("[data-del]").forEach(x=>bind(x,"click",e=>{e.stopPropagation();pushUndo();const id=x.dataset.del;wlist().forEach(w=>{if(w.netId===id)w.netId=null;});delete S.nets[id];if(S.activeNet===id)S.activeNet=null;if(S.defaultNet===id)S.defaultNet=null;markDirty();renderInsp();rebuild();}));
  bind(s.querySelector("#net-add"),"click",()=>{pushUndo();const id=addNet(s.querySelector("#net-name").value.trim());S.defaultNet=id;markDirty();renderInsp();});
  bind(s.querySelector("#net-name"),"keydown",e=>{if(e.key==="Enter"){const id=addNet(e.target.value.trim());S.defaultNet=id;markDirty();renderInsp();}});}

// ===== tools =====
const ICON={select:'<path d="M4 3l7 16 2-6 6-2z"/>',board:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.4"/>',pad:'<circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/>',wire:'<circle cx="5" cy="6" r="2.4"/><circle cx="19" cy="18" r="2.4"/><path d="M7 7c4 2 6 6 10 9"/>'};
const TOOLS=[["select","선택 V"],["board","보드 B"],["pad","패드 P"],["wire","배선 W"]];
function renderTools(){const t=document.getElementById("tools");t.innerHTML="";
  TOOLS.forEach(([id,label])=>{const b=h(`<button class="tool ${S.tool===id?'on':''}" title="${label}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">${ICON[id]}</svg><span class="kbd">${label.slice(-1)}</span></button>`);
    bind(b,"click",()=>{S.tool=id;S.wireStart=null;renderTools();updateStatus();});t.appendChild(b);if(id==="wire")t.appendChild(h('<div class="toolsep"></div>'));});
  const fit=h(`<button class="tool" title="화면 맞춤 F"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>`);bind(fit,"click",fitView);t.appendChild(h('<div class="toolsep"></div>'));t.appendChild(fit);
  const del=h(`<button class="tool" title="삭제 Del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 7h14M9 7V5h6v2M7 7l1 12h8l1-12"/></svg></button>`);bind(del,"click",delSel);t.appendChild(del);}
function renderViews(){const vs=document.getElementById("viewseg");vs.innerHTML="";VIEWS.forEach(([id,label])=>{const b=h(`<button data-v="${id}" class="${S.view===id?'on':''}">${label}</button>`);bind(b,"click",()=>setView(id));vs.appendChild(b);});}

// ===== status/tip =====
function updateStatus(){document.getElementById("st-view").textContent=(VIEWS.find(v=>v[0]===S.view)||["","3D"])[1];
  document.getElementById("st-boards").textContent=blist().length;document.getElementById("st-nodes").textContent=nlist().length;document.getElementById("st-wires").textContent=wlist().length;
  let sel="선택 없음";if(S.sel){const o=S.sel.t==="board"?S.boards[S.sel.id]:S.sel.t==="node"?S.nodes[S.sel.id]:S.wires[S.sel.id];if(o)sel=(S.sel.t==="board"?"보드: "+o.name:S.sel.t==="node"?"패드: "+o.name:"배선");}
  document.getElementById("st-sel").textContent=sel;
  document.getElementById("st-mode").innerHTML=S.simulate?'<span class="simon">● 시뮬 — 입력 패드 클릭</span>':(S.tool==="wire"?'배선: 패드 두 개 클릭':(S.tool==="pad"?'보드 위 클릭해 패드 추가':(S.tool==="board"?'바닥 클릭해 보드 추가':'')));
  const tip=document.getElementById("tip");
  if(S.simulate){tip.style.display="block";tip.innerHTML='<b>시뮬레이션</b> — <span style="color:var(--cyan)">입력 패드</span> 클릭 시 연결 네트 점등';}
  else if(S.tool==="wire"){tip.style.display="block";tip.innerHTML='<b>배선</b> — 패드 A → 패드 B 클릭 (Shift 연속)';}
  else if(!blist().length){tip.style.display="block";tip.innerHTML='<b>시작</b> — <kbd>B</kbd> 바닥 클릭해 보드 → <kbd>P</kbd> 보드 클릭해 패드 → <kbd>W</kbd> 배선. 좌드래그로 회전.';}
  else tip.style.display="none";}
let toastT;function toast(m){const tip=document.getElementById("tip");tip.style.display="block";tip.innerHTML="<b>"+esc(m)+"</b>";clearTimeout(toastT);toastT=setTimeout(updateStatus,1600);}

// ===== project / file =====
const hasFS='showSaveFilePicker' in window;
const baseName=s=>String(s).replace(/\.(wnest|json)$/i,"");
function serialize(){return {app:"wirenest",v:2,name:S.project?S.project.name:"Untitled",ppm:4,boards:S.boards,nodes:S.nodes,wires:S.wires,nets:S.nets,uid};}
function loadData(d){S.boards=d.boards||{};S.nodes=d.nodes||{};S.wires=d.wires||{};S.nets=d.nets||{};uid=d.uid||1;undoStack=[];redoStack=[];
  Object.values(S.nodes).forEach(n=>{if(n.parent!==undefined){n.board=n.parent;n.face="top";n.u=n.lx;n.v=n.ly;delete n.parent;delete n.lx;delete n.ly;}if(n.face==="through")n.face="top";});
  Object.values(S.boards).forEach(b=>{if(b.d==null)b.d=b.h||30;if(b.z==null)b.z=0;});
  S.sel=null;recompute();renderInsp();rebuild();requestAnimationFrame(()=>fitView());}
function updateProjName(){const el=document.getElementById("projname");if(!el||!S.project)return;el.innerHTML=esc(S.project.name)+(S.project.dirty?' <span class="dirty">•</span>':'');document.title=S.project.name+" — WireNest 3D";}
function newProject(name){S.project={name:(name&&name.trim())||"Untitled",fileHandle:null,dirty:false};S.boards={};S.nodes={};S.wires={};S.nets={};uid=1;undoStack=[];redoStack=[];
  [["1-Wire DQ","#ffee58"],["GND","#90a4ae"],["5V","#ef5350"],["LED DI","#26c6da"],["LED DO","#42a5f5"]].forEach(([n,c])=>addNet(n,c));
  S.defaultNet=Object.keys(S.nets)[0]||null;S.sel=null;updateProjName();recompute();renderInsp();rebuild();hideHome();requestAnimationFrame(()=>fitView());}
function loadSample(){newProject("예제 프로젝트");
  const pos=[[0,0],[62,0],[0,54],[62,54]];const B=[];
  pos.forEach((p,i)=>{const id=nid();S.boards[id]={id,name:"Slot "+(i+1),x:p[0],y:p[1],z:0,w:52,d:46,thick:1.6,rot:0,color:"#1c5e38"};B.push(id);
    const cx=26,cy=23,rad=15;for(let j=0;j<8;j++){const a=(j/8)*Math.PI*2,q=nid();S.nodes[q]={id:q,board:id,face:"top",u:cx+Math.cos(a)*rad,v:cy+Math.sin(a)*rad,name:"D"+(j+1),kind:"signal",state:false};}
    const dq=nid();S.nodes[dq]={id:dq,board:id,face:"top",u:cx-3,v:cy,name:"DQ",kind:i===0?"input":"signal",state:false};
    const gn=nid();S.nodes[gn]={id:gn,board:id,face:"bottom",u:cx+3,v:cy,name:"GND",kind:"gnd",state:false};
    const di=nid();S.nodes[di]={id:di,board:id,face:"top",u:4,v:41,name:"DI",kind:"input",state:false};
    const doo=nid();S.nodes[doo]={id:doo,board:id,face:"top",u:48,v:41,name:"DO",kind:"output",state:false};
    S.boards[id]._={dq,gn,di,doo};});
  const nets=Object.keys(S.nets);const mkw=(a,b,g,net)=>{const w=nid();S.wires[w]={id:w,a,b,awg:g,netId:net,color:null};};
  const bs=blist();for(let i=0;i<bs.length;i++){const r=bs[i]._;mkw(r.di,r.dq,22,nets[3]);mkw(r.dq,r.doo,22,nets[4]);if(i>0){const pr=bs[i-1]._;mkw(pr.doo,r.di,20,nets[0]);mkw(pr.gn,r.gn,18,nets[1]);}}
  bs.forEach(b=>delete b._);S.sel=null;recompute();renderInsp();rebuild();requestAnimationFrame(()=>fitView());}
function downloadJSON(data,fn){const blob=new Blob([JSON.stringify(data)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fn;a.click();}
async function saveProject(){if(!S.project)return;const data=serialize();try{
  if(S.project.fileHandle){const wr=await S.project.fileHandle.createWritable();await wr.write(JSON.stringify(data));await wr.close();S.project.dirty=false;updateProjName();toast("저장됨");return;}await saveProjectAs();}catch(e){if(e.name!=="AbortError")alert("저장 실패: "+e.message);}}
async function saveProjectAs(){if(!S.project)return;const data=serialize();
  if(hasFS){const hd=await showSaveFilePicker({suggestedName:(S.project.name||"harness")+".wnest",types:[{description:"WireNest 프로젝트",accept:{"application/json":[".wnest",".json"]}}]});
    const wr=await hd.createWritable();await wr.write(JSON.stringify(data));await wr.close();S.project.fileHandle=hd;S.project.name=baseName(hd.name);S.project.dirty=false;updateProjName();toast("저장됨");}
  else{downloadJSON(data,(S.project.name||"harness")+".wnest");toast("다운로드됨");}}
async function openProject(){
  if(hasFS){try{const[hd]=await showOpenFilePicker({types:[{description:"WireNest 프로젝트",accept:{"application/json":[".wnest",".json"]}}]});
    const f=await hd.getFile();const d=JSON.parse(await f.text());S.project={name:d.name||baseName(f.name),fileHandle:hd,dirty:false};loadData(d);updateProjName();hideHome();}catch(e){if(e.name!=="AbortError")alert("열기 실패: "+e.message);}}
  else document.getElementById("loadfile").click();}
function exportImage(){needRender=true;renderer.render(scene,camera);const url=renderer.domElement.toDataURL("image/png");const a=document.createElement("a");a.href=url;a.download=((S.project&&S.project.name)||"harness")+".png";a.click();}
document.getElementById("loadfile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);S.project={name:d.name||baseName(f.name),fileHandle:null,dirty:false};loadData(d);updateProjName();hideHome();}catch(err){alert("불러오기 실패: "+err.message);}};rd.readAsText(f);e.target.value="";});
document.getElementById("imgfile").addEventListener("change",e=>{const f=e.target.files[0];if(!f||!pendingImgBoard)return;const rd=new FileReader();
  rd.onload=()=>{const b=S.boards[pendingImgBoard];if(!b)return;pushUndo();markDirty();if(pendingImgFace==="bottom")b.imgBottom=rd.result;else b.img=rd.result;renderInsp();rebuild();};rd.readAsDataURL(f);e.target.value="";});

// ===== menu & overlays =====
const homeEl=document.getElementById("home"),expEl=document.getElementById("expdlg"),ddEl=document.getElementById("filedd");
function hideHome(){homeEl.hidden=true;}function showHome(){homeEl.hidden=false;document.getElementById("home-newform").hidden=true;}
document.getElementById("filemenu").onclick=e=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();ddEl.style.left=r.left+"px";ddEl.style.top=(r.bottom+4)+"px";ddEl.hidden=!ddEl.hidden;};
document.addEventListener("click",()=>{ddEl.hidden=true;});
ddEl.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ddEl.hidden=true;const a=b.dataset.a;if(a==="new"||a==="home")showHome();else if(a==="open")openProject();else if(a==="save")saveProject();else if(a==="export")expEl.hidden=false;});
document.getElementById("home-new").onclick=()=>{const nf=document.getElementById("home-newform");nf.hidden=false;const i=document.getElementById("home-name");i.value="";i.focus();};
document.getElementById("home-open").onclick=openProject;
document.getElementById("home-create").onclick=()=>newProject(document.getElementById("home-name").value);
document.getElementById("home-name").addEventListener("keydown",e=>{if(e.key==="Enter")newProject(e.target.value);});
document.getElementById("home-cancel").onclick=()=>{document.getElementById("home-newform").hidden=true;};
document.getElementById("home-sample").onclick=loadSample;
document.getElementById("exp-close").onclick=()=>{expEl.hidden=true;};
document.getElementById("exp-file").onclick=()=>{expEl.hidden=true;saveProjectAs();};
document.getElementById("exp-img").onclick=()=>{expEl.hidden=true;exportImage();};
document.getElementById("home-fsnote").textContent=hasFS?"":"※ 다운로드 방식으로 저장 (Chrome·Edge 권장)";
document.getElementById("wirestyle").addEventListener("change",e=>{S.wireStyle=e.target.value;rebuild();});
document.getElementById("snapmm").addEventListener("input",e=>{snapMM=Math.max(0,num(e.target.value));tc.setTranslationSnap(snapMM>0?snapMM:null);});
document.getElementById("simbtn").onclick=()=>{S.simulate=!S.simulate;const b=document.getElementById("simbtn");b.classList.toggle("on",S.simulate);b.style.background=S.simulate?"var(--good)":"";b.style.color=S.simulate?"#0a1a0d":"";b.textContent=S.simulate?"■ 종료":"▶ 시뮬";if(S.simulate)nlist().forEach(n=>{if(n.kind==="input")n.state=false;});recompute();rebuild();};
document.getElementById("themebtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",cur==="dark"?"light":"dark");themeBG();needRender=true;};
addEventListener("beforeunload",e=>{if(S.project&&S.project.dirty){e.preventDefault();e.returnValue="";}});

// ===== loop =====
function loop(){controls.update();if(needRender){renderer.render(scene,camera);needRender=false;}requestAnimationFrame(loop);}
function init(){S.project={name:"Untitled",fileHandle:null,dirty:false};renderTools();renderViews();renderInsp();updateProjName();resize();setView("iso");showHome();loop();}
init();
</script>
</body>
